  // ---------- الخصوبة والدورة ----------
  function vFertility() {
    const S = env.S, d = E.derive(env), f = d.fert, today = U.dayKey(S.clock.now);
    const te = S.fertility.find(x => x.date === today) || {};
    const bl = new Set(S.bleeding.filter(b => !b.spotting).map(b => b.date));
    const head = '<h2>الخصوبة والدورة</h2>' + fl('fert') +
      '<div class="alert warn">تقديرات إحصائية من تواريخ دوراتك فقط؛ <b>ليست وسيلة لمنع الحمل</b> ولا تؤكد الإباضة ولا تشخّص. في المتلازمة قد تكون الدورات غير منتظمة فيصبح التقدير واسعاً. القرار الطبي لطبيبك.</div>';
    const logCard = '<div class="card" style="margin-top:12px"><h3>تسجيل اليوم · ' + today + '</h3><div class="row">' +
      '<button class="btn" data-act="startPeriod">بدأت دورتي اليوم</button>' +
      '<label>اختبار LH<select id="f-lh"><option value="">لم أُجرِ</option><option value="neg"' + (te.lh === 'neg' ? ' selected' : '') + '>سلبي</option><option value="pos"' + (te.lh === 'pos' ? ' selected' : '') + '>إيجابي</option></select></label>' +
      '<label>إفرازات عنق الرحم<select id="f-mu">' + [['', 'لم أسجّل'], ['dry', 'جافة'], ['sticky', 'لزجة'], ['creamy', 'كريمية'], ['eggwhite', 'شفافة مطاطية']].map(o => '<option value="' + o[0] + '"' + (te.mucus === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>' +
      '<button class="btn sec" data-act="saveFert">حفظ</button></div>' +
      '<p class="small mut">نتيجة LH الإيجابية تُقرّب تقدير الإباضة (غالباً خلال يوم إلى يومين). في المتلازمة قد يرتفع LH مزمناً فتظهر نتائج إيجابية كاذبة. الإفرازات تُسجَّل للمتابعة ولا تدخل في الحساب.</p></div>';
    if (f.empty) return head + '<div class="card" style="margin-top:12px"><p>لا توجد بداية دورة مسجّلة. سجّلي أيام النزيف (تبويب «الأعراض والنزيف») أو اضغطي «بدأت دورتي اليوم».</p></div>' + logCard;
    const rng = (a, b) => a === b ? a : a + ' ← ' + b;
    const cal = OvaFertility.calendar(f, bl);
    const strip = '<div class="cal" role="img" aria-label="شريط أيام الدورة الحالية">' + cal.map(c => '<span class="cd ' + c.cls + '" title="' + c.key + '">' + c.day + '</span>').join('') + '</div>' +
      '<p class="small mut"><span class="lg bl"></span> نزيف · <span class="lg fr"></span> نافذة الخصوبة المقدّرة · <span class="lg ov"></span> الإباضة المقدّرة · <span class="lg np"></span> مجال الدورة القادمة · <span class="lg td"></span> اليوم</p>';
    const conf = f.confidence === 'low' ? pill('ثقة منخفضة', 'warn') : pill('ثقة متوسطة', 'info');
    const why = [];
    if (f.insufficient) why.push('عدد الدورات المسجّلة قليل (' + f.n + ')؛ سجّلي ثلاث دورات على الأقل لتحسين التقدير.');
    f.reasons.forEach(r => why.push(r));
    if (f.longGap) why.push('مرّ أكثر من 90 يوماً منذ آخر دورة: يُنصح بمراجعة الطبيب.');
    return head +
      '<div class="grid g3" style="margin-top:12px">' +
      tile('اليوم من الدورة', f.dayOfCycle, esc(OvaFertility.PHASE_AR[f.phase])) +
      tile('الدورة القادمة (تقدير)', '<span class="mono" style="font-size:15px">' + f.nextStart.lo.slice(5) + ' ← ' + f.nextStart.hi.slice(5) + '</span>', 'المنتصف ' + f.nextStart.key) +
      tile('متوسط طول الدورة', f.mean != null ? f.mean + ' يوماً' : '—', f.n ? 'من ' + f.n + ' دورة' + (f.sd != null ? ' · ±' + f.sd : '') : 'يلزم دورتان') +
      tile('الإباضة المقدّرة', '<span class="mono" style="font-size:15px">' + f.ovulation.key.slice(5) + '</span>', f.ovulation.basis === 'LH' ? 'من اختبار LH إيجابي' : 'من التقويم ±' + Math.round((U.dayKeyToT(f.ovulation.hi) - U.dayKeyToT(f.ovulation.lo)) / U.DAY / 2) + ' أيام') +
      tile('نافذة الخصوبة المقدّرة', '<span class="mono" style="font-size:15px">' + f.fertile.from.slice(5) + ' ← ' + f.fertile.to.slice(5) + '</span>', '6 أيام تنتهي بيوم الإباضة [23]') +
      tile('موثوقية التقدير', conf, f.irregular ? 'دورات غير منتظمة' : '') + '</div>' +
      '<div class="card" style="margin-top:12px"><h3>دورتك الحالية</h3>' + strip + '</div>' +
      '<div class="card" style="margin-top:12px"><h3>ماذا يعني هذا لحالتك؟</h3>' +
      (f.irregular ? '<div class="alert warn">دوراتك مصنّفة <b>غير منتظمة</b> وفق معايير الإرشاد الدولي [24]: ' + esc(f.reasons.join(' ')) + ' لذلك قد لا تحدث إباضة في كل دورة، وموعد النافذة أعلاه تقريبي جداً.</div>' : '') +
      (why.length && !f.irregular ? why.map(w => '<div class="alert info">' + esc(w) + '</div>').join('') : '') +
      (f.lens.length ? '<p class="small mut">أطوال دوراتك الأخيرة (أيام): <span class="mono">' + f.lens.join(' · ') + '</span></p>' : '') +
      '<p class="small mut">لم نحسب أي «نسبة احتمال حمل»: لا يوجد أساس موثوق لحسابها من هذه البيانات. التتبع يساعدك على فهم نمطك ومشاركته مع طبيبك.</p></div>' + logCard +
      (S.fertility.length ? '<div class="card" style="margin-top:12px"><h3>آخر التسجيلات</h3><div class="scroll"><table><thead><tr><th>التاريخ</th><th>LH</th><th>الإفرازات</th></tr></thead><tbody>' + S.fertility.slice(-8).reverse().map(x => '<tr><td>' + x.date + '</td><td>' + ({ pos: 'إيجابي', neg: 'سلبي' }[x.lh] || '—') + '</td><td>' + ({ dry: 'جافة', sticky: 'لزجة', creamy: 'كريمية', eggwhite: 'شفافة مطاطية' }[x.mucus] || '—') + '</td></tr>').join('') + '</tbody></table></div></div>' : '');
  }

    return '<div class="card welcome">' + fl('wel') + dots + body + '<hr><div class="row"><button class="btn sec sm" data-act="wDone">تخطي والبدء بالبيانات التجريبية</button></div><p class="small mut">البيانات تركيبية وتبقى في متصفحك فقط.</p></div>';

  const VIEWS = { home: vHome, measure: vMeasure, food: vFood, symptoms: vSymptoms, twin: vTwin, chat: vChat, fertility: vFertility, doctor: vDoctor, device: vDevice, lab: vLab, about: vAbout };

  const busyEditing = () => { const a = document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.id !== 'scale'; };

  // ---------- المؤقّت ----------
  function tick() {
    const c = env.S.clock;
    if (!c.running) return;
    E.advance(env, c.now + c.scale * 1000);
    save();
    const el = $('#simnow'); if (el) el.textContent = U.fmtDT(c.now);
    if (env.S.onboarded && (tab === 'home' || tab === 'device') && !busyEditing()) { $('#view').innerHTML = VIEWS[tab](); }
  }

  // ---------- الأفعال ----------
  async function act(name, el) {
    const S = env.S, now = S.clock.now, d = el ? el.dataset : {};
    switch (name) {
      case 'estop': S.device.faultLatched = 'USER_STOP'; env.gate.audit(now, 'DEVICE', 'USER_STOP', 'إيقاف طارئ من المريضة'); setFlash('home', 'أُوقف التوصيل. اضغطي «استئناف التوصيل» حين تكونين مستعدة.', 'warn'); break;
      case 'saveNote': { const t = val('dn-t').trim().slice(0, 400); if (!t) { setFlash('doc', 'اكتبي نص الرسالة.', 'warn'); break; } S.doctorNote = { text: t, t: now }; env.gate.audit(now, 'NOTE', 'DOCTOR_NOTE', 'رسالة من الطبيب'); setFlash('doc', 'أُرسلت الرسالة وستظهر في الصفحة الرئيسية للمريضة.', 'ok'); break; }
      case 'startPeriod': {
        const k = U.dayKey(now);
        if (!S.bleeding.some(x => x.date === k)) S.bleeding = S.bleeding.concat({ date: k, pads: { l: 0, m: 1, s: 0 } }).sort((a, b) => a.date < b.date ? -1 : 1);
        setFlash('fert', 'سُجّلت بداية الدورة اليوم. حدّثي كمية النزيف من تبويب «الأعراض والنزيف».', 'ok'); break;
      }
      case 'saveFert': { const k = U.dayKey(now); S.fertility = S.fertility.filter(x => x.date !== k).concat({ date: k, lh: val('f-lh'), mucus: val('f-mu') }).sort((a, b) => a.date < b.date ? -1 : 1); setFlash('fert', 'تم الحفظ وتحديث التقدير.', 'ok'); break; }
      case 'wRole': wstep = 1; if (d.r === 'doctor') { S.role = 'doctor'; } break;
      case 'wSave': {
        const a = num('w-a'), h = num('w-h'), w = num('w-w');
        if (!(a >= 10 && a <= 90 && h >= 120 && h <= 220 && w >= 30 && w <= 250)) { setFlash('wel', 'تحقّقي من العمر والطول والوزن.', 'warn'); break; }
        const p = S.patient; p.name = val('w-n').trim() || p.name; p.age = a; p.heightCm = h; p.weightKg = w; p.pregnant = chk('w-p'); p.hypertension = chk('w-hy');
        E.addReading(env, 'weight', w); wstep = 2; break;
      }
      case 'wPair': env.device.applyPatch(now); env.gate.audit(now, 'DEVICE', 'PATCH_APPLIED', 'ربط عند الإعداد'); S.onboarded = true; tab = S.role === 'doctor' ? 'doctor' : 'home'; wstep = 0; break;
      case 'wDone': S.onboarded = true; tab = S.role === 'doctor' ? 'doctor' : 'home'; wstep = 0; break;
      case 'goto': tab = d.v; flash = {}; render(); window.scrollTo(0, 0); return;
      case 'runToggle': S.clock.running = !S.clock.running; save(); renderClock(); return;
      case 'jump': E.advance(env, now + Number(d.h) * U.HOUR); break;
      case 'addMeasure': {
        const type = val('m-type'), v = num('m-val');
        if (!isFinite(v) || val('m-val') === '') { setFlash('measure', 'أدخلي قيمة صحيحة.', 'warn'); break; }
        if (type === 'weight' && (v < 30 || v > 250)) { setFlash('measure', 'الوزن خارج النطاق المعقول.', 'warn'); break; }
        if (type === 'lab_glucose' && (v < 20 || v > 600)) { setFlash('measure', 'قيمة الجلوكوز خارج النطاق المعقول.', 'warn'); break; }
        if (type === 'bp') { const dia = num('m-dia'); if (!(v >= 70 && v <= 260 && dia >= 40 && dia <= 160)) { setFlash('measure', 'قيم الضغط غير معقولة.', 'warn'); break; } E.addReading(env, 'bp', v, { dia }); }
        else E.addReading(env, type, v);
        setFlash('measure', type === 'lab_glucose' ? (S.device.patchApplied ? 'تم الحفظ ومعايرة المستشعر.' : 'تم الحفظ (لا رقعة للمعايرة).') : 'تم الحفظ.', 'ok'); break;
      }
      case 'exportCsv': {
        const rows = ['time,type,value,source'].concat(S.readings.filter(r => r.t > now - 7 * U.DAY).map(r => [U.fmtDT(r.t), r.type, r.value, r.src].join(',')));
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\n')], { type: 'text/csv' })); a.download = 'ovasense-readings.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
      }
      case 'saveProfile': { const p = S.patient; p.heightCm = num('p-h') || p.heightCm; p.age = num('p-a') || p.age; p.activity = val('p-act'); p.goal = val('p-goal'); setFlash('food', 'تم تحديث الملف والخطة.', 'ok'); break; }
      case 'shuffleDiet': dietSeed++; break;
      case 'pantryToggle': { const pt = pantry(), id = d.v; pt.have = pt.have.includes(id) ? pt.have.filter(x => x !== id) : pt.have.concat(id); if (pt.res) pt.res = Date.now(); break; }
      case 'pantryAdd': { const pt = pantry(), r = KT.parse(val('pt-txt')); pt.have = [...new Set(pt.have.concat(r.ids))]; pt.unknown = r.unknown; if (pt.res) pt.res = Date.now(); break; }
      case 'pantryClear': { const pt = pantry(); pt.have = []; pt.res = null; pt.unknown = []; break; }
      case 'suggestMeal': { const pt = pantry(); const r = KT.parse(val('pt-txt')); pt.have = [...new Set(pt.have.concat(r.ids))]; pt.unknown = r.unknown; pt.slot = val('pt-slot') || 'any'; if (!pt.have.length) { setFlash('kit', 'اختاري أو اكتبي مكوّنات أولاً.', 'warn'); pt.res = null; break; } pt.res = Date.now(); break; }
      case 'logRecipe': { const c = Number(d.c); E.addMeal(env, d.n, c); setFlash('kit', 'سُجّلت «' + esc(d.n) + '» (' + c + ' جم كربوهيدرات) وستظهر في نموذج الجلوكوز.', 'ok'); break; }
      case 'saveBody': {
        const b = body(E.derive(env)), m = {}; BD.FIELDS.forEach(f => m[f.k] = num('bd-' + f.k));
        const bad = BD.validate(m); if (bad.length) { setFlash('body', 'تحققي من: ' + bad.join('، '), 'warn'); break; }
        b.m = m; setFlash('body', 'تم بناء المجسّم من قياساتك.', 'ok'); break;
      }
      case 'clearShape': { if (S.body) S.body.shape = null; setFlash('scan', 'أُلغيت نسب المسح.', 'info'); break; }
      case 'addMeal': { const c = num('ml-c'); if (!(c >= 0 && c <= 300)) { setFlash('food', 'كربوهيدرات غير معقولة (0–300).', 'warn'); break; } E.addMeal(env, val('ml-n') || 'وجبة', c); setFlash('food', 'سُجّلت الوجبة. شغّلي المحاكاة أو اقفزي ساعة لترين الأثر.', 'ok'); break; }
      case 'checkSupp': {
        S.patient.meds = val('sp-m'); S.patient.pregnant = chk('sp-p'); S.patient.hypertension = chk('sp-h');
        const r = AI.supplementCheck(val('sp-q'), { meds: S.patient.meds, pregnant: S.patient.pregnant, hypertension: S.patient.hypertension });
        setFlash('supp', esc(r.text) + (r.warnings ? r.warnings.map(w => '<br>⚠ ' + esc(w)).join('') : ''), r.found ? (r.level === 'caution' ? 'warn' : 'info') : 'warn'); break;
      }
      case 'saveSymptoms': {
        const k = U.dayKey(now), e = { date: k }; ['acne', 'hirsutism', 'fatigue', 'mood', 'cramps', 'bloating', 'hairloss', 'headache'].forEach(f => e[f] = num('s-' + f));
        S.symptoms = S.symptoms.filter(x => x.date !== k).concat(e).sort((a, b) => a.date < b.date ? -1 : 1); setFlash('sym', 'تم حفظ أعراض اليوم.', 'ok'); break;
      }
      case 'saveBleeding': {
        const k = U.dayKey(now);
        const e = { date: k, pads: { l: num('b-pl'), m: num('b-pm'), s: num('b-ps') }, clotsS: num('b-cs'), clotsL: num('b-cl'), flooding: chk('b-fl'), spotting: chk('b-sp'), dizzy: chk('b-dz') };
        S.bleeding = S.bleeding.filter(x => x.date !== k).concat(e).sort((a, b) => a.date < b.date ? -1 : 1);
        const a = AI.bleedingAnalysis(S.bleeding, now);
        setFlash('sym', a.urgent ? 'مؤشرات خطر: توجهي للطوارئ أو تواصلي مع الطبيب فوراً.' : 'تم حفظ النزيف وتحديث التحليل.', a.urgent ? 'danger' : 'ok'); break;
      }
      case 'preset': S.twin.deficit = Number(d.d); S.twin.act = Number(d.a); S.twin.adh = Number(d.p); break;
      case 'ask': await ask(d.q); return;
      case 'clearChat': S.chat = []; break;
      case 'saveLabs': { const i = val('l-ins'), a = val('l-a1c'); S.labs.fastingInsulin = i === '' ? null : Number(i); S.labs.hba1c = a === '' ? null : Number(a); S.labs.labIntervalDays = Math.max(7, num('l-int') || 90); S.labs.lastLabT = now; env.gate.audit(now, 'LAB', 'ENTERED', 'by doctor'); setFlash('doc', 'حُفظت التحاليل وسُجّل تحليل اليوم.', 'ok'); break; }
      case 'saveRange': { const lo = num('r-lo'), hi = num('r-hi'); if (!(lo >= 40 && hi > lo && hi <= 300)) { setFlash('doc', 'نطاق غير صالح.', 'warn'); break; } S.range = { low: lo, high: hi }; setFlash('doc', 'حُفظ النطاق.', 'ok'); break; }
      case 'signPlan': {
        const times = val('pl-times').split(',').map(x => x.trim()).filter(Boolean);
        const spec = { doseUL: num('pl-dose'), times, singleMaxUL: num('pl-sm'), dailyCapUL: num('pl-dc'), minIntervalMin: num('pl-mi'), onSignalLoss: val('pl-sl') };
        const bad = !times.length || times.some(t => !/^([01]\d|2[0-3]):[0-5]\d$/.test(t)) || !(spec.doseUL > 0) || spec.doseUL > spec.singleMaxUL || spec.singleMaxUL > spec.dailyCapUL || !(spec.minIntervalMin >= 0);
        if (bad) { setFlash('doc', 'تحقق من الحقول: أوقات بصيغة HH:MM، والجرعة ≤ الحد الأقصى ≤ السقف اليومي.', 'warn'); break; }
        const need = spec.doseUL * times.length * 7;
        const r = await E.signAndInstallPlan(env, spec, now);
        setFlash('doc', r.ok ? 'تم توقيع الخطة (إصدار ' + r.version + ') وقبلها الجهاز.' + (need > 1000 ? ' ⚠ استهلاك أسبوعي ' + need + ' µL يتجاوز سعة الخزان 1000 µL.' : '') : 'رفض الجهاز الخطة: ' + esc(r.label), r.ok ? 'ok' : 'danger'); break;
      }
      case 'sendCmd': {
        const dose = num('cmd-dose'); if (!(dose > 0)) { setFlash('doc', 'جرعة غير صالحة.', 'warn'); break; }
        const r = await E.sendCommand(env, { doseUL: dose }, now);
        setFlash('doc', r.code === 'OK' ? 'نُفّذ الأمر: ' + r.deliveredUL + ' µL (انحراف ' + r.deviationPct + '%).' : 'لم يُنفَّذ: ' + esc(r.label || r.code), r.code === 'OK' ? 'ok' : 'danger'); break;
      }
      case 'rotateKey': { const old = S.doctor.keyId; await E.provisionDoctor(env, now); env.gate.revokeKey(old, now); setFlash('doc', 'أُلغي المفتاح ' + old + ' وأُصدر مفتاح جديد. الخطة المثبتة تبقى سارية.', 'ok'); break; }
      case 'newPatch': env.device.applyPatch(now); env.gate.audit(now, 'DEVICE', 'PATCH_APPLIED', 'رقعة جديدة'); setFlash('dev', 'رُكّبت رقعة جديدة وامتلأ الخزان.', 'ok'); break;
      case 'removePatch': env.device.removePatch(); env.gate.audit(now, 'DEVICE', 'PATCH_REMOVED', ''); break;
      case 'toggleBle': S.device.bleUp = !S.device.bleUp; env.gate.audit(now, 'DEVICE', S.device.bleUp ? 'BLE_UP' : 'BLE_DOWN', ''); break;
      case 'clearFault': env.device.clearFault(); env.gate.audit(now, 'DEVICE', 'FAULT_CLEARED', ''); break;
      case 'fault': S.device.faults[d.k] = el.checked; break;
      case 'attack': { const r = await E.runAttack(env, d.id, now); labResults = labResults.filter(x => x.id !== r.id).concat(r); break; }
      case 'runAll': labResults = []; for (const a of E.attacks) labResults.push(await E.runAttack(env, a.id, now)); break;
      case 'tour': startTour(); return;
      case 'tourNext': await tourStep(1); return;
      case 'tourPrev': await tourStep(-1); return;
      case 'tourClose': $('#tour').hidden = true; tourI = -1; return;
      case 'reset': if (confirm('سيتم حذف بياناتك التجريبية وإعادة إنشائها. متابعة؟')) { try { localStorage.removeItem(LS); } catch (e) { } labResults = []; env = await E.seedDemo(Date.now()); tab = 'home'; flash = {}; } else return; break;
      default: return;
    }
    save(); render();
  }

  async function ask(q) {
    const S = env.S;
    q = (q || '').trim(); if (!q) return;
    S.chat.push({ who: 'u', text: q });
    const r = CH.reply(q, E.derive(env));
    S.chat.push({ who: 'b', text: r.text, sources: r.sources, tone: r.tone });
    if (S.chat.length > 60) S.chat = S.chat.slice(-60);
    save(); if (tab !== 'chat') tab = 'chat'; render();
  }

  // ---------- جولة العرض ----------
  const TOUR = [
    { t: 'الرئيسية: ما يقرؤه الجهاز الآن', x: 'نلاحظ الجلوكوز الحالي، الوقت ضمن النطاق، الجرعة القادمة، وتقدير حاجة التحليل مع أسبابه.', f: async () => { tab = 'home'; } },
    { t: 'وجبة ← أثر على الجلوكوز', x: 'سجّلنا وجبة 70 جم كربوهيدرات وتقدّم الزمن ساعة: يرتفع الجلوكوز في الرسم.', f: async () => { tab = 'home'; E.addMeal(env, 'غداء', 70); E.advance(env, env.S.clock.now + U.HOUR); } },
    { t: 'المساعد المخصص لبياناتها', x: 'يسأل: «وش يقرأ الجهاز بالضبط؟» ثم «هل أحتاج تحليل دم؟».', f: async () => { await ask('وش يقرأ الجهاز بالضبط؟'); await ask('هل أحتاج تحليل دم؟'); } },
    { t: 'التوأم الرقمي: ماذا لو؟', x: 'نطاق متوقع للوزن وسكر الصيام لو التزمت بنظام ونشاط.', f: async () => { tab = 'twin'; } },
    { t: 'الطبيب: خطة موقَّعة وسجل تدقيق', x: 'الجهاز لا ينفّذ إلا ما وقّعه الطبيب ضمن الحدود.', f: async () => { tab = 'doctor'; } },
    { t: 'مختبر الأمان', x: 'كل الهجمات تُصَدّ: إعادة إرسال، تعديل جرعة، مفتاح مُلغى، أمر الذكاء الاصطناعي بلا توقيع…', f: async () => { tab = 'lab'; labResults = []; for (const a of E.attacks) labResults.push(await E.runAttack(env, a.id, env.S.clock.now)); } },
    { t: 'عطل: انسداد ← توقف تلقائي', x: 'نحقن انسداداً ونتقدم إلى موعد الجرعة: حساس التدفق يكشف الانحراف ويوقف التوصيل ويُنبّه.', f: async () => { tab = 'device'; env.S.device.faults.occlusion = true; const nd = E.nextDose(env.gate.s.plan, env.S.clock.now); if (nd) E.advance(env, nd.t + 6 * U.MIN); } }
  ];
  function drawTour() {
    const el = $('#tour'); if (tourI < 0) { el.hidden = true; return; }
    const s = TOUR[tourI];
    el.hidden = false;
    el.innerHTML = '<b>' + (tourI + 1) + '/' + TOUR.length + ' · ' + esc(s.t) + '</b><p>' + esc(s.x) + '</p><div class="row"><button class="btn sm" data-act="tourNext">' + (tourI === TOUR.length - 1 ? 'إنهاء' : 'التالي') + '</button><button class="btn sec sm" data-act="tourPrev">السابق</button><button class="btn sec sm" data-act="tourClose">إغلاق</button></div>';
  }
  async function tourStep(dir) {
    if (dir > 0 && tourI === TOUR.length - 1) { tourI = -1; drawTour(); return; }
    tourI = Math.max(0, tourI + dir);
    flash = {}; await TOUR[tourI].f(); save(); render(); drawTour();
  }
  async function startTour() { tourI = -1; await tourStep(1); }

  // ---------- الإقلاع ----------
  async function boot() {
    try {
      if (!OvaCrypto.available()) throw new Error('WebCrypto غير متاح في هذا المتصفح/السياق. افتحي الصفحة عبر https أو localhost.');
      const saved = load();
      env = saved ? E.attach(saved) : await E.seedDemo(Date.now());
      if (!saved) save();
      render();
      timer = setInterval(tick, 1000);
    } catch (e) {
      $('#view').innerHTML = '<div class="alert danger">تعذّر تشغيل التطبيق: ' + esc(e.message) + '</div>';
      console.error(e);
    }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.type === 'checkbox') return;
    act(b.dataset.act, b).catch(err => { console.error(err); setFlash('home', 'خطأ: ' + esc(err.message), 'danger'); });
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'scale') { env.S.clock.scale = Number(t.value); save(); return; }
    if (t.dataset && t.dataset.act === 'fault') { act('fault', t); return; }
    if (t.id === 'bd-scan') { scanBody(t.files && t.files[0]); return; }
    if (t.id === 'pt-slot') { const pt = pantry(); pt.slot = t.value; save(); if (pt.res) render(); return; }
    if (t.id === 'bd-unit') { const b = env.S.body; b.unit = t.value; b.n = Math.min(b.n, BD.UNITS[b.unit].max); save(); render(); return; }
    if (t.dataset && t.dataset.twin) {
      const tw = env.S.twin;
      tw.deficit = num('t-def'); tw.act = num('t-act'); tw.adh = num('t-adh'); tw.horizon = num('t-hor'); tw.fgAssumption = num('t-ass') || 0;
      save(); render();
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.out) { const o = document.getElementById(t.dataset.out); if (o) o.textContent = t.value; }
    if (t.id === 'bd-n') { env.S.body.n = Number(t.value); updateBodyLive(); save(); }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'chatform') { e.preventDefault(); const i = $('#chat-in'); const q = i.value; i.value = ''; ask(q); }
  });
  window.addEventListener('beforeunload', () => { try { if (env) save(); } catch (e) { } });
  window.__ova = { get env() { return env; } };
  boot();
})();
</script>
</body></html>

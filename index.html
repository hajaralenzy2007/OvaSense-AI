<script>/* OvaUtil — أدوات مساعدة عامة (توقيت السعودية UTC+3 ثابت) */
(function (g) {
  'use strict';
  const U = {};
  U.MIN = 60000; U.HOUR = 3600000; U.DAY = 86400000; U.TZ = 3 * 3600000;
  const pad = n => String(n).padStart(2, '0');
  U.clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  U.mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
  U.sd = a => {
    if (a.length < 2) return NaN;
    const m = U.mean(a);
    return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
  };
  U.round = (x, d = 0) => { const p = Math.pow(10, d); return Math.round(x * p) / p; };
  U.dayKey = t => new Date(t + U.TZ).toISOString().slice(0, 10);
  U.dayStart = t => Math.floor((t + U.TZ) / U.DAY) * U.DAY - U.TZ;
  U.dayKeyToT = k => Date.parse(k + 'T00:00:00Z') - U.TZ;
  U.hour = t => { const d = new Date(t + U.TZ); return d.getUTCHours() + d.getUTCMinutes() / 60; };
  U.hhmm = t => { const d = new Date(t + U.TZ); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
  U.fmtDT = t => U.dayKey(t) + ' ' + U.hhmm(t);
  U.parseHM = s => { const p = String(s).split(':').map(Number); return ((p[0] || 0) * 60 + (p[1] || 0)) * U.MIN; };

  U.rng = seed => {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.gauss = r => { let u = 0; while (!u) u = r(); const v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  function ranks(a) {
    const idx = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0]);
    const r = new Array(a.length);
    for (let i = 0; i < idx.length;) {
      let j = i;
      while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
      const avg = (i + j) / 2 + 1;
      for (let k = i; k <= j; k++) r[idx[k][1]] = avg;
      i = j + 1;
    }
    return r;
  }
  U.spearman = (x, y) => {

<script>/* OvaDevice — محاكي الجهاز (قرص إلكتروني + رقعة). بيانات تركيبية لأغراض العرض فقط. */
(function (g) {
  'use strict';
  const U = g.OvaUtil;
  const D = {};
  D.HARD = { singleMaxUL: 50, dailyMaxUL: 200 };       // حدود صلبة في برنامج الجهاز لا يتجاوزها أي مخطط
  D.PATCH_LIFE_DAYS = 7;
  D.RESERVOIR_UL = 1000;
  D.LOW_RESERVOIR_UL = 150;

  D.newState = function (seed) {
    return {
      deviceId: 'OVA-POD-0001', seed: seed || 20260, patchApplied: false, patchAppliedAt: null,
      reservoirUL: 0, batteryPct: 100, bleUp: true, faultLatched: null,
      faults: { occlusion: false, overflow: false, driftFast: false },
      driftPerDay: 0.012, calib: null, baseGlucose: 94
    };
  };

  D.create = function (state, getMeals) {
    const s = state;
    const dev = { state: s };
    const meals = () => (getMeals ? getMeals() : []);

    dev.ageDays = t => s.patchApplied ? Math.max(0, (t - s.patchAppliedAt) / U.DAY) : 0;
    dev.drift = () => s.faults.driftFast ? 0.05 : s.driftPerDay;

    dev.applyPatch = t => {
      s.patchApplied = true; s.patchAppliedAt = t; s.reservoirUL = D.RESERVOIR_UL;
      s.calib = null; s.faultLatched = null; s.batteryPct = 100;
    };
    dev.removePatch = () => { s.patchApplied = false; s.patchAppliedAt = null; s.reservoirUL = 0; s.calib = null; };
    dev.clearFault = () => { s.faultLatched = null; s.faults.occlusion = false; s.faults.overflow = false; };
    dev.tick = dtMin => { if (s.patchApplied) s.batteryPct = Math.max(0, s.batteryPct - 0.004 * dtMin); };

    // الجلوكوز «الحقيقي» (نموذج وجبات: استجابة غاما مبسّطة)
    dev.trueGlucose = t => {
      const h = U.hour(t);
      let gl = s.baseGlucose + 3 * Math.sin(2 * Math.PI * (h - 4) / 24);
      const dayN = U.gauss(U.rng((s.seed ^ Math.floor(U.dayStart(t) / U.DAY)) >>> 0));
      gl += 2.5 * dayN;
      for (const m of meals()) {
        const x = (t - m.t) / (50 * U.MIN);
        if (x >= 0 && x < 8) gl += m.carbs * 0.9 * x * Math.exp(1 - x);
      }
      return gl;
    };
    const noiseAt = t => {
      const r = U.rng((s.seed + Math.floor(t / U.MIN) * 2654435761) >>> 0);
      return U.gauss(r);
    };

    // قراءة السائل الخلالي: تأخر ~7 دقائق، انجراف الحساسية مع عمر الرقعة، ضجيج، ومعايرة بقياس دم
    dev.rawSens = t => {
      const age = dev.ageDays(t);
      return Math.max(0.3, 1 - dev.drift() * age);
    };
    dev.senseGlucose = t => {
      if (!s.patchApplied) return null;
      const age = dev.ageDays(t);
      const lagged = dev.trueGlucose(t - 7 * U.MIN);
      let sens = dev.rawSens(t);
      let ageEff = age;
      if (s.calib) { sens = sens / dev.rawSens(s.calib.t) * s.calib.factor; ageEff = Math.max(0, age - dev.ageDays(s.calib.t)); }
      const value = lagged * sens + noiseAt(t) * 2.0 * (1 + age * 0.04);
      const q = U.clamp(1 - ageEff * dev.drift() * 4 - (s.faults.driftFast ? 0.1 : 0), 0, 1);
      return { value: U.round(value, 1), q: U.round(q, 2) };
    };
    // معايرة بقياس دم مرجعي (إصبع/مختبر)
    dev.calibrate = (t, ref) => {
      if (!s.patchApplied) return false;
      const raw = dev.trueGlucose(t - 7 * U.MIN) * dev.rawSens(t);
      s.calib = { t, factor: U.clamp(ref / raw, 0.8, 1.25) };
      return true;
    };
    // مؤشر هرموني HM1 (وحدات اعتباطية): يُحدَّد المؤشر الفعلي بعد مرحلة التحقق
    dev.senseHM1 = t => {
      if (!s.patchApplied) return null;
      const v = 50 + 7 * Math.sin(2 * Math.PI * t / U.DAY) + 5 * Math.sin(2 * Math.PI * t / (28 * U.DAY)) + 1.5 * noiseAt(t + 17);
      return U.round(v, 1);
    };

    // التوصيل: حقن مُوجَّه + مراقبة تدفق (المأمور مقابل المقاس)
    dev.deliver = (now, doseUL, rateULmin) => {
      const rate = rateULmin || 5;
      if (!s.patchApplied) return { ok: false, status: 'NO_PATCH', commandedUL: doseUL, deliveredUL: 0 };
      let factor = 1 + 0.03 * U.gauss(U.rng((s.seed + Math.floor(now / U.MIN)) >>> 0));
      if (s.faults.occlusion) factor = 0.02;
      if (s.faults.overflow) factor = 1.35;
      const measuredFull = doseUL * factor;
      const dev_ = (measuredFull - doseUL) / doseUL;
      if (Math.abs(dev_) > 0.20) {
        const delivered = U.round(Math.min(doseUL * 0.2 * Math.max(0, factor), doseUL), 2);
        s.reservoirUL = Math.max(0, s.reservoirUL - delivered);
        s.faultLatched = 'FLOW_MISMATCH';
        return { ok: false, status: 'HALTED_FLOW_MISMATCH', commandedUL: doseUL, deliveredUL: delivered, measuredUL: U.round(measuredFull, 2), deviationPct: U.round(dev_ * 100, 1), durationMin: U.round(doseUL / rate * 0.2, 2) };
      }
      const delivered = U.round(measuredFull, 2);
      s.reservoirUL = Math.max(0, s.reservoirUL - delivered);
      return { ok: true, status: 'DELIVERED', commandedUL: doseUL, deliveredUL: delivered, measuredUL: delivered, deviationPct: U.round(dev_ * 100, 1), durationMin: U.round(doseUL / rate, 2) };
    };

    dev.alerts = now => {
      const a = [];
      if (!s.patchApplied) a.push({ lvl: 'warn', code: 'NO_PATCH', text: 'لا توجد رقعة مركّبة.' });
      else {
        const age = dev.ageDays(now);
        if (age >= D.PATCH_LIFE_DAYS) a.push({ lvl: 'warn', code: 'PATCH_EXPIRED', text: 'انتهى العمر التصميمي للرقعة (' + D.PATCH_LIFE_DAYS + ' أيام): يُنصح باستبدالها.' });
        if (s.reservoirUL <= D.LOW_RESERVOIR_UL) a.push({ lvl: 'warn', code: 'RESERVOIR_LOW', text: 'الخزان منخفض (' + U.round(s.reservoirUL) + ' µL).' });
        const sg = dev.senseGlucose(now);
        if (sg && sg.q < 0.6) a.push({ lvl: 'warn', code: 'SIGNAL_POOR', text: 'جودة الإشارة منخفضة؛ يُنصح بقياس دم مرجعي للمعايرة.' });
      }
      if (s.faultLatched) a.push(s.faultLatched === 'USER_STOP' ? { lvl: 'warn', code: 'USER_STOP', text: 'أوقفتِ التوصيل يدوياً (إيقاف طارئ). لن تُنفَّذ أي جرعة حتى تستأنفي. إن كان السبب أعراضاً فتواصلي مع طبيبك.' } : { lvl: 'danger', code: s.faultLatched, text: 'توقّف التوصيل تلقائياً: عدم تطابق التدفق المقاس مع المأمور به. يلزم تدخل.' });
      if (s.batteryPct <= 15) a.push({ lvl: 'warn', code: 'BATTERY_LOW', text: 'البطارية منخفضة (' + U.round(s.batteryPct) + '%).' });
      if (!s.bleUp) a.push({ lvl: 'info', code: 'BLE_DOWN', text: 'انقطاع اتصال البلوتوث؛ يستمر الجهاز بالمخطط الموقَّع وفق السياسة.' });
      return a;
    };
    return dev;
  };

  g.OvaDevice = D;
  if (typeof module !== 'undefined' && module.exports) module.exports = D;
})(globalThis);
</script>
<script>/* OvaSecurity — بوابة الأوامر في الجهاز: توقيع الطبيب، الخطة الموقَّعة، حدود الجرعة، سجل تدقيق مترابط */
(function (g) {
  'use strict';
  const U = g.OvaUtil, C = g.OvaCrypto, D = g.OvaDevice;
  const S = {};

  S.CODES = {
    UNSIGNED: 'أمر بلا توقيع (مثل أمر من الذكاء الاصطناعي)',
    UNKNOWN_KEY: 'مفتاح غير معروف للجهاز',
    KEY_REVOKED: 'مفتاح الطبيب مُلغى',
    BAD_SIGNATURE: 'التوقيع غير صالح (تم العبث بالأمر)',
    WRONG_DEVICE: 'الأمر موجّه لجهاز آخر',
    WRONG_PATIENT: 'الأمر موجّه لمريضة أخرى',
    NOT_YET_VALID: 'الأمر لم يحن وقته',
    EXPIRED: 'انتهت صلاحية الأمر',
    REPLAY_NONCE: 'أمر مُعاد الإرسال (nonce مستخدم)',
    SEQ_NOT_INCREASING: 'رقم تسلسل غير متزايد',
    NO_PLAN: 'لا توجد خطة علاج موقَّعة',
    NOT_IN_PLAN: 'المادة غير مدرجة في الخطة',
    DOSE_OVER_SINGLE_MAX: 'الجرعة تتجاوز الحد الأقصى للجرعة الواحدة',
    DAILY_CAP_EXCEEDED: 'تجاوز السقف اليومي',
    MIN_INTERVAL: 'أقل من الفاصل الزمني الأدنى بين الجرعات',
    DEVICE_FAULT: 'عطل مُسجَّل في الجهاز (حالة آمنة)',
    NO_PATCH: 'لا توجد رقعة',
    RESERVOIR_LOW: 'الخزان غير كافٍ',
    BLE_DOWN: 'الاتصال منقطع',
    PLAN_ROLLBACK: 'رفض خطة بإصدار أقدم (حماية من الرجوع)',
    PLAN_EXPIRED: 'انتهت صلاحية الخطة',
    PLAN_EXCEEDS_HARD_LIMIT: 'الخطة تتجاوز الحدود الصلبة للجهاز',
    PLAN_INVALID: 'خطة غير مكتملة',
    LATE_WINDOW: 'فات موعد الجرعة (أكثر من 6 ساعات)',
    BLE_DOWN_HOLD: 'تعليق الجرعة (سياسة فقدان الإشارة: تعليق)',
    HALTED_FLOW_MISMATCH: 'توقف تلقائي: تدفق مقاس لا يطابق المأمور به'
  };

  S.newState = function (deviceId, patientId) {
    return { deviceId, patientId, trustedKeys: {}, plan: null, planKeyId: null, lastSeq: 0, nonces: [], deliveries: [], done: {}, audit: [], planExpiredLogged: false };
  };

  S.verifyChain = function (audit) {
    let prev = 'GENESIS';
    for (let i = 0; i < audit.length; i++) {
      const e = audit[i];
      const h = C.sha256Hex(prev + C.canonical({ i: e.i, t: e.t, type: e.type, code: e.code, detail: e.detail }));
      if (e.i !== i || e.prev !== prev || e.hash !== h) return { ok: false, brokenAt: i };
      prev = e.hash;
    }
    return { ok: true, brokenAt: -1, length: audit.length };
  };

  S.createGate = function (device, state) {
    const s = state;
    const gate = { s, device };

    gate.audit = (t, type, code, detail) => {
      const prev = s.audit.length ? s.audit[s.audit.length - 1].hash : 'GENESIS';
      const e = { i: s.audit.length, t, type, code: code || '', detail: detail || '' };
      e.prev = prev;
      e.hash = C.sha256Hex(prev + C.canonical({ i: e.i, t, type, code: e.code, detail: e.detail }));
      s.audit.push(e);
      return e;
    };
    gate.provisionKey = (keyId, jwk, t) => { s.trustedKeys[keyId] = { jwk, status: 'active' }; gate.audit(t, 'KEY', 'PROVISIONED', keyId); };
    gate.revokeKey = (keyId, t) => { if (s.trustedKeys[keyId]) { s.trustedKeys[keyId].status = 'revoked'; gate.audit(t, 'KEY', 'REVOKED', keyId); } };

    gate.deliveredToday = (substance, now) => {
      const k = U.dayKey(now);
      return s.deliveries.filter(d => d.substance === substance && U.dayKey(d.t) === k).reduce((a, d) => a + d.deliveredUL, 0);
    };
    gate.limitCheck = (item, doseUL, now) => {
      if (doseUL > item.singleMaxUL || doseUL > D.HARD.singleMaxUL) return 'DOSE_OVER_SINGLE_MAX';
      if (gate.deliveredToday(item.substance, now) + doseUL > Math.min(item.dailyCapUL, D.HARD.dailyMaxUL)) return 'DAILY_CAP_EXCEEDED';
      const last = s.deliveries.filter(d => d.substance === item.substance && d.deliveredUL > 0).slice(-1)[0];
      if (last && now - last.t < item.minIntervalMin * U.MIN) return 'MIN_INTERVAL';
      return null;
    };
    gate.deviceCheck = (doseUL, needBle) => {
      const d = device.state;
      if (d.faultLatched) return 'DEVICE_FAULT';
      if (!d.patchApplied) return 'NO_PATCH';
      if (d.reservoirUL < doseUL) return 'RESERVOIR_LOW';
      if (needBle && !d.bleUp) return 'BLE_DOWN';
      return null;
    };
    const reject = (now, code, detail) => { gate.audit(now, 'REJECT', code, detail); return { ok: false, code, label: S.CODES[code] || code }; };
    const keyCheck = async (env, payload, now) => {
      if (!env || !env.sig || !payload || !payload.keyId) return 'UNSIGNED';
      const k = s.trustedKeys[payload.keyId];
      if (!k) return 'UNKNOWN_KEY';
      if (k.status !== 'active') return 'KEY_REVOKED';
      if (!(await C.verify(k.jwk, payload, env.sig))) return 'BAD_SIGNATURE';
      return null;
    };

    gate.installPlan = async function (env, now) {
      const p = env && env.plan;
      const kc = await keyCheck(env, p, now);
      if (kc) return reject(now, kc, 'plan');
      if (!p.items || !p.items.length || !p.version) return reject(now, 'PLAN_INVALID', 'plan');
      if (p.deviceId !== s.deviceId) return reject(now, 'WRONG_DEVICE', 'plan');
      if (p.patientId !== s.patientId) return reject(now, 'WRONG_PATIENT', 'plan');
      if (now < p.issuedAt) return reject(now, 'NOT_YET_VALID', 'plan');
      if (now > p.expiresAt) return reject(now, 'EXPIRED', 'plan');
      if (s.plan && p.version <= s.plan.version) return reject(now, 'PLAN_ROLLBACK', 'v' + p.version + '<=v' + s.plan.version);
      for (const it of p.items) {
        if (it.singleMaxUL > D.HARD.singleMaxUL || it.dailyCapUL > D.HARD.dailyMaxUL) return reject(now, 'PLAN_EXCEEDS_HARD_LIMIT', it.substance);
      }
      s.plan = p; s.planKeyId = p.keyId; s.planExpiredLogged = false;
      gate.audit(now, 'PLAN', 'INSTALLED', 'v' + p.version + ' by ' + p.keyId);
      return { ok: true, version: p.version };
    };

    // أمر لمرة واحدة موقَّع
    gate.execute = async function (env, now) {
      const c = env && env.cmd;
      const kc = await keyCheck(env, c, now);
      if (kc) return reject(now, kc, c && c.cmdId);
      if (c.deviceId !== s.deviceId) return reject(now, 'WRONG_DEVICE', c.cmdId);
      if (c.patientId !== s.patientId) return reject(now, 'WRONG_PATIENT', c.cmdId);
      if (now < c.issuedAt) return reject(now, 'NOT_YET_VALID', c.cmdId);
      if (now > c.expiresAt) return reject(now, 'EXPIRED', c.cmdId);
      if (s.nonces.includes(c.nonce)) return reject(now, 'REPLAY_NONCE', c.cmdId);
      if (!(c.seq > s.lastSeq)) return reject(now, 'SEQ_NOT_INCREASING', c.cmdId);
      s.nonces.push(c.nonce); if (s.nonces.length > 200) s.nonces.shift();
      s.lastSeq = c.seq;
      if (!s.plan) return reject(now, 'NO_PLAN', c.cmdId);
      if (now > s.plan.expiresAt) return reject(now, 'PLAN_EXPIRED', c.cmdId);
      const item = s.plan.items.find(i => i.substance === c.substance);
      if (!item) return reject(now, 'NOT_IN_PLAN', c.cmdId);
      const lc = gate.limitCheck(item, c.doseUL, now);
      if (lc) return reject(now, lc, c.cmdId);
      const dc = gate.deviceCheck(c.doseUL, true);
      if (dc) return reject(now, dc, c.cmdId);
      const r = device.deliver(now, c.doseUL, c.rateULmin);
      if (r.deliveredUL > 0) s.deliveries.push({ t: now, substance: c.substance, commandedUL: c.doseUL, deliveredUL: r.deliveredUL, source: 'cmd' });
      gate.audit(now, r.ok ? 'DELIVER' : 'HALT', r.status, c.cmdId + ' ' + c.substance + ' cmd=' + c.doseUL + ' meas=' + r.measuredUL);
      return Object.assign({ code: r.ok ? 'OK' : r.status, label: r.ok ? 'تم التوصيل' : S.CODES[r.status] }, r);
    };

    // تنفيذ الخطة الموقَّعة تلقائياً (يعمل داخل الجهاز حتى عند انقطاع البلوتوث وفق السياسة)
    gate.runSchedule = function (now) {
      const p = s.plan, out = [];
      if (!p) return out;

      }

      for (const it of p.items) {
        for (const tm of it.times) {
          const key = day + '|' + it.substance + '|' + tm;
          if (s.done[key]) continue;
          const due = U.dayStart(now) + U.parseHM(tm);
          if (now < due) continue;
          s.done[key] = 1;
          if (now - due > 6 * U.HOUR) { gate.audit(now, 'SKIP', 'LATE_WINDOW', key); out.push({ code: 'LATE_WINDOW', substance: it.substance, t: now }); continue; }
          if (!device.state.bleUp && p.onSignalLoss === 'hold') { gate.audit(now, 'SKIP', 'BLE_DOWN_HOLD', key); out.push({ code: 'BLE_DOWN_HOLD', substance: it.substance, t: now }); continue; }
          const lc = gate.limitCheck(it, it.doseUL, now) || gate.deviceCheck(it.doseUL, false);
          if (lc) { gate.audit(now, 'REJECT', lc, 'plan ' + key); out.push({ code: lc, substance: it.substance, t: now }); continue; }
          const r = device.deliver(now, it.doseUL, it.rateULmin || 5);
          if (r.deliveredUL > 0) s.deliveries.push({ t: now, substance: it.substance, commandedUL: it.doseUL, deliveredUL: r.deliveredUL, source: 'plan' });
          gate.audit(now, r.ok ? 'DELIVER' : 'HALT', r.status, 'plan ' + key + ' meas=' + r.measuredUL);
          out.push(Object.assign({ code: r.ok ? 'OK' : r.status, substance: it.substance, t: now }, r));
        }
      }
      const cutoff = U.dayKey(now - 3 * U.DAY);
      const keys = Object.keys(s.done);
      if (keys.length > 120) keys.forEach(k => { if (k.slice(0, 10) < cutoff) delete s.done[k]; });
      return out;
    };
    return gate;
  };

  // أدوات للطبيب: بناء وتوقيع الأوامر والخطط
  S.signPlan = async function (privJwk, plan) { return { plan, sig: await C.sign(privJwk, plan) }; };
  S.signCmd = async function (privJwk, cmd) { return { cmd, sig: await C.sign(privJwk, cmd) }; };
  S.nextCmd = function (ctx, o) {
    // ctx: {keyId, deviceId, patientId, seq, now}
    return Object.assign({
      cmdId: 'C' + ctx.seq, keyId: ctx.keyId, deviceId: ctx.deviceId, patientId: ctx.patientId,
      rateULmin: 5, issuedAt: ctx.now, expiresAt: ctx.now + 10 * U.MIN, seq: ctx.seq,
      nonce: C.sha256Hex(ctx.keyId + ':' + ctx.seq + ':' + ctx.now).slice(0, 16)
    }, o);
  };

  g.OvaSecurity = S;
  if (typeof module !== 'undefined' && module.exports) module.exports = S;
})(globalThis);
</script>
<script>/* OvaAI — دعم قرار محلي (قواعد + إحصاء). لا يشخّص ولا ينفّذ جرعات: أي اقتراح يحتاج توقيع الطبيب. */
(function (g) {
  'use strict';
  const U = g.OvaUtil, KB = g.OvaKB;
  const AI = {};

  const glu = (rs, a, b) => rs.filter(r => r.type === 'glucose' && r.t >= a && r.t <= b);

  AI.glucoseStats = function (readings, from, to, range) {
    range = range || { low: 70, high: 140 };
    const v = glu(readings, from, to).map(r => r.value);
    if (!v.length) return { n: 0 };
    const m = U.mean(v), s = U.sd(v);
    const below = v.filter(x => x < range.low).length, above = v.filter(x => x > range.high).length;
    return {
      n: v.length, mean: U.round(m, 1), sd: U.round(s, 1), cv: U.round(s / m * 100, 1),
      tirPct: U.round((v.length - below - above) / v.length * 100, 1),
      belowPct: U.round(below / v.length * 100, 1), abovePct: U.round(above / v.length * 100, 1),
      min: Math.min.apply(null, v), max: Math.max.apply(null, v)
    };
  };

  AI.signalQuality = function (readings, now, hours) {
    const q = glu(readings, now - (hours || 6) * U.HOUR, now).filter(r => r.q != null).map(r => r.q);
    return q.length ? U.round(U.mean(q), 2) : null;
  };

  // متوسط سكر الصيام (05:00–08:00) لكل يوم
  AI.fastingByDay = function (readings) {
    const by = {};
    readings.filter(r => r.type === 'glucose').forEach(r => {
      const h = U.hour(r.t);
      if (h >= 5 && h < 8) (by[U.dayKey(r.t)] = by[U.dayKey(r.t)] || []).push(r.value);
    });
    return Object.keys(by).sort().map(k => ({ day: k, mean: U.mean(by[k]) }));
  };

  AI.adherence = function (plan, deliveries, now, days) {
    if (!plan) return null;
    days = days || 7;
    const from = Math.max(now - days * U.DAY, plan.issuedAt);
    let sched = 0;
    for (let d = U.dayStart(from); d <= now; d += U.DAY) {
      for (const it of plan.items) for (const tm of it.times) { const due = d + U.parseHM(tm); if (due > from && due <= now) sched++; }
    }
    if (!sched) return null;
    const done = deliveries.filter(x => x.t > from && x.t <= now && x.deliveredUL > 0).length;
    return U.clamp(Math.round(done / sched * 100), 0, 100);
  };

  // ---------- تقدير حاجة التحليل (مع الأسباب) ----------
  AI.bloodTestNeed = function (c) {
    const R = [];
    const add = (code, pts, text) => R.push({ code, pts, text });
    if (c.quality != null && c.quality < 0.6) add('SIGNAL_POOR', 35, 'جودة إشارة المستشعر منخفضة (' + c.quality + ') — تلزم معايرة بقياس دم مرجعي.');
    else if (c.quality != null && c.quality < 0.75) add('SIGNAL_DRIFT', 15, 'بدأ انجراف الإشارة (جودة ' + c.quality + ').');
    const lastLab = c.lastLabT;
    if (!lastLab || c.now - lastLab > (c.labIntervalDays || 90) * U.DAY) add('LAB_DUE', 25, 'حان موعد التحليل الدوري الذي حدده الطبيب (كل ' + (c.labIntervalDays || 90) + ' يوماً).');
    if (c.patchAgeDays >= 3 && !c.calibratedThisPatch) add('NO_CALIBRATION', 10, 'الرقعة الحالية لم تُعايَر بقياس دم بعد.');
    if (c.stats && c.stats.n && c.stats.belowPct > 5) add('LOW_READINGS', 15, 'نسبة قراءات منخفضة مرتفعة (' + c.stats.belowPct + '%) — تُؤكَّد بقياس دم.');
    if (c.stats && c.stats.n && c.stats.cv > 36) add('HIGH_VARIABILITY', 10, 'تذبذب القراءات مرتفع (CV ' + c.stats.cv + '%).');
    if (c.fastingHighDays >= 3) add('FASTING_HIGH', 15, 'سكر صائم أعلى من حد الطبيب في ' + c.fastingHighDays + ' أيام حديثة.');
    if (c.bleedingUrgent) add('BLEEDING_RED_FLAG', 40, 'مؤشرات نزيف تستدعي تقييماً طبياً مباشراً (وليس مجرد تحليل).');
    R.sort((a, b) => b.pts - a.pts);
    const score = Math.min(100, R.reduce((s, r) => s + r.pts, 0));
    const level = score >= 60 ? 'high' : score >= 30 ? 'medium' : 'low';
    return {
      score, level, reasons: R,
      label: { high: 'يُنصح بتحليل دم قريباً', medium: 'تحليل دم قد يكون مفيداً', low: 'لا حاجة لتحليل دم الآن' }[level]
    };
  };

  // ---------- مراجعة خطة الجرعات (اقتراحات فقط، ضمن حدود الخطة، بلا تنفيذ) ----------
  AI.dosePlanReview = function (c) {
    const out = [];
    const P = (code, text) => out.push({ code, text, requiresDoctor: true, withinPlan: true, canExecute: false });
    const alerts = c.deviceAlerts || [];
    if (alerts.some(a => a.code === 'FLOW_MISMATCH')) P('CHECK_DEVICE', 'توقف التوصيل بسبب عدم تطابق التدفق: يُقترح فحص الجهاز وإبلاغ الطبيب قبل استئناف الجرعات.');
    if (c.quality != null && c.quality < 0.6) P('CONFIRM_READING', 'يُقترح قياس دم مرجعي ومعايرة المستشعر قبل الاعتماد على القراءات في أي قرار.');
    if (c.stats && c.stats.n && c.stats.belowPct > 5) P('REVIEW_LOWS', 'رُصدت قراءات منخفضة؛ يُقترح إبلاغ الطبيب لمراجعة توقيت الخطة (ضمن حدودها).');
    if (c.adherencePct != null && c.adherencePct < 80) P('ADHERENCE', 'نسبة الالتزام ' + c.adherencePct + '% — يُقترح تفعيل تذكيرات إضافية ومراجعة أسباب فوات الجرعات.');
    if (!out.length) out.push({ code: 'KEEP', text: 'لا اقتراح تعديل: الخطة الحالية مناسبة للقراءات المتاحة ضمن حدودها.', requiresDoctor: false, withinPlan: true, canExecute: false });
    return out;
  };

  // ---------- النزيف: PBAC + الأنماط ----------
  AI.pbacDay = function (e) {
    const p = e.pads || {}, t = e.tampons || {};
    return (p.l || 0) * 1 + (p.m || 0) * 5 + (p.s || 0) * 20 + (t.l || 0) * 1 + (t.m || 0) * 5 + (t.s || 0) * 10 +
      (e.clotsS || 0) * 1 + (e.clotsL || 0) * 5 + (e.flooding ? 5 : 0);
  };
  AI.bleedingAnalysis = function (entries, now) {
    const days = entries.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    const T = d => U.dayKeyToT(d);
    const episodes = [];
    for (const e of days) {
      const last = episodes[episodes.length - 1];
      if (last && (T(e.date) - T(last.end)) <= 1 * U.DAY) { last.end = e.date; last.entries.push(e); }
      else episodes.push({ start: e.date, end: e.date, entries: [e] });
    }
    episodes.forEach(ep => {
      ep.days = Math.round((T(ep.end) - T(ep.start)) / U.DAY) + 1;
      ep.pbac = ep.entries.reduce((s, e) => s + AI.pbacDay(e), 0);
      ep.spottingOnly = ep.entries.every(e => e.spotting) && ep.days <= 2;
      ep.flags = [];
      ep.entries.forEach(e => {
        const sat = ((e.pads || {}).s || 0) + ((e.tampons || {}).s || 0);
        if (sat >= 8 || (e.flooding && sat >= 4)) ep.flags.push('SOAKING');
        if ((e.clotsL || 0) >= 1) ep.flags.push('LARGE_CLOTS');
        if (e.dizzy) ep.flags.push('DIZZY');
      });
      ep.heavy = ep.pbac > 100;
      ep.prolonged = ep.days > 8;
    });
    const periods = episodes.filter(e => !e.spottingOnly);
    const cycleLens = [];
    for (let i = 1; i < periods.length; i++) cycleLens.push(Math.round((T(periods[i].start) - T(periods[i - 1].start)) / U.DAY));
    const patterns = [];
    const lastP = periods[periods.length - 1];
    const urgent = !!(lastP && (lastP.flags.includes('DIZZY') || (lastP.flags.includes('SOAKING') && lastP.flags.includes('LARGE_CLOTS'))));
    if (lastP) {
      if (lastP.heavy) patterns.push({ code: 'HEAVY', sev: 'warn', text: 'نزيف غزير بحسب PBAC (' + lastP.pbac + ' > 100) — يُنصح بمراجعة الطبيب.' });
      if (lastP.prolonged) patterns.push({ code: 'PROLONGED', sev: 'warn', text: 'مدة النزيف ' + lastP.days + ' أيام (أكثر من 8).' });
      if (lastP.flags.includes('SOAKING')) patterns.push({ code: 'SOAKING', sev: 'warn', text: 'تشبّع شديد بالفوط في يوم واحد.' });
      if (lastP.flags.includes('LARGE_CLOTS')) patterns.push({ code: 'LARGE_CLOTS', sev: 'warn', text: 'خثرات كبيرة مسجّلة.' });
      if (lastP.flags.includes('DIZZY')) patterns.push({ code: 'DIZZY', sev: 'danger', text: 'دوخة مع النزيف — تقييم طبي عاجل.' });
    }
    if (urgent) patterns.unshift({ code: 'URGENT', sev: 'danger', text: 'مؤشرات خطر: توجهي للطوارئ أو تواصلي مع الطبيب فوراً.' });
    if (cycleLens.length) {
      const recent = cycleLens.slice(-3), m = U.mean(recent);
      if (m > 35) patterns.push({ code: 'LONG_CYCLES', sev: 'info', text: 'متوسط طول الدورة ≈ ' + U.round(m) + ' يوماً (أكثر من 35): نمط دورات متباعدة.' });
      else if (m < 21) patterns.push({ code: 'SHORT_CYCLES', sev: 'info', text: 'متوسط طول الدورة ≈ ' + U.round(m) + ' يوماً (أقل من 21): دورات متقاربة.' });
      else patterns.push({ code: 'NORMAL_LEN', sev: 'ok', text: 'متوسط طول الدورة ≈ ' + U.round(m) + ' يوماً (ضمن 21–35).' });
      if (Math.max.apply(null, recent) - Math.min.apply(null, recent) >= 9) patterns.push({ code: 'VARIABLE', sev: 'info', text: 'تفاوت كبير بين أطوال الدورات (9 أيام أو أكثر).' });
    }
    if (lastP && now) {
      const since = Math.round((now - T(lastP.end)) / U.DAY);
      if (since > 90) patterns.push({ code: 'NO_PERIOD_90', sev: 'warn', text: 'لا نزيف منذ ' + since + ' يوماً (أكثر من 90): يُنصح بمراجعة الطبيب.' });
    }
    if (episodes.some(e => e.spottingOnly)) patterns.push({ code: 'SPOTTING', sev: 'info', text: 'تم تسجيل تبقيع بين الدورات.' });
    return {
      episodes: episodes.map(e => ({ start: e.start, end: e.end, days: e.days, pbac: e.pbac, spottingOnly: e.spottingOnly, heavy: e.heavy, flags: Array.from(new Set(e.flags)) })),
      cycleLens, patterns, urgent,
      note: 'PBAC تقدير ذاتي وليس قياساً؛ القيمة فوق 100 تقابل غالباً فقداً أكثر من نحو 80 مل. لا يُعد تشخيصاً.'
    };
  };

  // ---------- ارتباط الأعراض بالقراءات (سبيرمان) ----------
  AI.symptomCorrelation = function (symptoms, readings) {
    const dayMean = (type) => {
      const by = {};
      readings.filter(r => r.type === type).forEach(r => (by[U.dayKey(r.t)] = by[U.dayKey(r.t)] || []).push(r.value));
      const o = {}; Object.keys(by).forEach(k => o[k] = U.mean(by[k])); return o;
    };
    const gm = dayMean('glucose'), hm = dayMean('hm1');
    const names = { acne: 'حب الشباب', hirsutism: 'نمو الشعر الزائد', fatigue: 'الإرهاق', mood: 'تقلب المزاج', cramps: 'ألم الحوض', bloating: 'الانتفاخ', hairloss: 'تساقط الشعر', headache: 'الصداع' };
    const res = [];
    const sources = [['متوسط الجلوكوز اليومي', gm], ['المؤشر الهرموني HM1', hm]];
    for (const [sn, map] of sources) {
      for (const k of Object.keys(names)) {
        const xs = [], ys = [];
        symptoms.forEach(s => { if (map[s.date] != null && s[k] != null) { xs.push(map[s.date]); ys.push(s[k]); } });
        if (xs.length < 10) { res.push({ a: sn, b: names[k], n: xs.length, rho: null, text: 'بيانات غير كافية (n=' + xs.length + ' < 10).' }); continue; }
        const rho = U.spearman(xs, ys);
        if (isNaN(rho)) { res.push({ a: sn, b: names[k], n: xs.length, rho: null, text: 'لا تباين كافٍ للحساب.' }); continue; }
        const ab = Math.abs(rho);
        const strength = ab < 0.3 ? 'لا ارتباط واضح' : ab < 0.6 ? 'ارتباط متوسط' : 'ارتباط قوي';
        res.push({ a: sn, b: names[k], n: xs.length, rho: U.round(rho, 2), strength, text: strength + (ab >= 0.3 ? (rho > 0 ? ' طردي' : ' عكسي') : '') + ' (ρ=' + U.round(rho, 2) + ', n=' + xs.length + ') — الارتباط لا يعني السببية.' });
      }
    }
    return res;
  };

  // ---------- النظام الغذائي ----------
  AI.energy = function (p) {
    const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age - 161;
    const af = { low: 1.2, moderate: 1.375, high: 1.55 }[p.activity || 'low'];
    const tdee = bmr * af;
    const deficit = p.goal === 'lose' ? Math.min(500, tdee * 0.2) : 0;
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), target: Math.max(1200, Math.round(tdee - deficit)) };
  };
  AI.dietPlan = function (p, seed) {
    const E = AI.energy(p), rng = U.rng(seed || 1);
    const F = id => KB.FOODS.find(f => f.id === id);
    const pick = arr => F(arr[Math.floor(rng() * arr.length)]);
    const slots = [
      { slot: 'b', label: 'الفطور', items: [{ f: pick(['egg', 'cottage']), q: 1 }, { f: pick(['oats', 'foul', 'wholebread']), q: 1, C: 1 }, { f: pick(['labneh', 'yogurt']), q: 1 }, { f: F('salad'), q: 0.5 }] },
      { slot: 's1', label: 'وجبة خفيفة', items: [{ f: F('apple'), q: 1, C: 1 }, { f: F('almond'), q: 0.5 }] },
      { slot: 'l', label: 'الغداء', items: [{ f: pick(['chicken', 'fish', 'lean']), q: 1 }, { f: pick(['lentil', 'chickpea', 'brownrice']), q: 1, C: 1 }, { f: F('salad'), q: 1 }, { f: F('cookedveg'), q: 1 }] },
      { slot: 's2', label: 'وجبة خفيفة', items: [{ f: pick(['yogurt', 'cottage']), q: 1 }, { f: F('cucumber'), q: 1 }] },
      { slot: 'd', label: 'العشاء', items: [{ f: pick(['fish', 'chicken']), q: 1 }, { f: pick(['lentil', 'chickpea', 'brownrice']), q: 0.5, C: 1 }, { f: F('salad'), q: 1 }, { f: F('cookedveg'), q: 1 }] }
    ];
    const tot = () => slots.reduce((s, m) => s + m.items.reduce((a, i) => a + i.f.kcal * i.q, 0), 0);
    const carbs = slots.flatMap(m => m.items.filter(i => i.C));
    let guard = 0;
    while (tot() < E.target - 90 && guard++ < 40) { const c = carbs.filter(i => i.q < 3).sort((a, b) => a.q - b.q)[0]; if (!c) break; c.q += 0.5; }
    const others0 = slots.flatMap(m => m.items.filter(i => !i.C));
    while (tot() < E.target - 90 && guard++ < 80) { const c = others0.filter(i => i.q < 2).sort((a, b) => a.f.kcal * a.q - b.f.kcal * b.q)[0]; if (!c) break; c.q += 0.5; }
    while (tot() > E.target + 90 && guard++ < 80) { const c = carbs.filter(i => i.q > 0.5).sort((a, b) => b.q - a.q)[0]; if (!c) break; c.q -= 0.5; }
    // إن بقي المجموع أعلى من الهدف، نخفّض حصص غير الكربوهيدرات الأكبر سعرات (حتى نصف حصة)
    const others = slots.flatMap(m => m.items.filter(i => !i.C));
    while (tot() > E.target + 90 && guard++ < 160) { const c = others.filter(i => i.q > 0.5).sort((a, b) => b.f.kcal * b.q - a.f.kcal * a.q)[0]; if (!c) break; c.q -= 0.5; }
    const sum = (items, k) => U.round(items.reduce((a, i) => a + i.f[k] * i.q, 0), 1);
    const meals = slots.map(m => {
      const items = m.items.map(i => ({ id: i.f.id, ar: i.f.ar, serving: i.f.serving, qty: i.q, kcal: Math.round(i.f.kcal * i.q), carb: U.round(i.f.carb * i.q, 1), protein: U.round(i.f.protein * i.q, 1), fiber: U.round(i.f.fiber * i.q, 1), gi: i.f.gi }));
      return { slot: m.slot, label: m.label, items, kcal: items.reduce((a, i) => a + i.kcal, 0), carb: U.round(items.reduce((a, i) => a + i.carb, 0), 1) };
    });
    const flat = meals.flatMap(m => m.items);
    return {
      energy: E, meals,
      totals: { kcal: flat.reduce((a, i) => a + i.kcal, 0), carb: U.round(flat.reduce((a, i) => a + i.carb, 0), 1), protein: U.round(flat.reduce((a, i) => a + i.protein, 0), 1), fiber: U.round(flat.reduce((a, i) => a + i.fiber, 0), 1) },
      notes: ['قيم الحصص تقريبية.', 'خطة عامة لا تغني عن أخصائية تغذية، وتُعدَّل مع حالات السكري/الكلى/الحمل.', 'الحد الأدنى للطاقة في المقترح 1200 سعر.']
    };
  };

  // ---------- المكملات والأعشاب ----------
  AI.supplementCheck = function (query, ctx) {
    ctx = ctx || {};
    const q = U.normAr(query);
    const entry = KB.SUPPLEMENTS.find(s => s.names.some(n => q.includes(U.normAr(n))));
    if (!entry) return { found: false, text: 'لا أملك معلومات موثوقة كافية عن «' + query + '». لا أخمّن؛ اسألي الصيدلي أو الطبيب.' };
    const w = [];
    const meds = U.normAr(ctx.meds || '');
    if (entry.flags.includes('pregnancy') && ctx.pregnant) w.push('تُجنَّب أثناء الحمل ما لم يوجّه الطبيب.');
    if (entry.flags.includes('hypertension') && ctx.hypertension) w.push('قد يرفع الضغط؛ لا يُستخدم مع ارتفاع الضغط دون إذن الطبيب.');
    if (entry.flags.includes('bleeding') && /وارفارين|مميع|اسبرين|warfarin|clopidogrel|aspirin|كلوبيدوجريل/.test(meds)) w.push('أدويتك المسجلة قد تزيد خطر النزف مع هذا المكمل.');
    if (entry.flags.includes('interaction') && meds) w.push('لديك أدوية مسجلة: اسألي الصيدلي عن التداخل قبل الاستخدام.');
    if (entry.flags.includes('needs_lab')) w.push('يُفضَّل قياس المستوى في الدم قبل أي جرعة.');
    return { found: true, entry, warnings: w, level: w.length ? 'caution' : 'info', text: entry.ar + ': ' + entry.evidence + ' ' + entry.cautions };
  };

  g.OvaAI = AI;
  if (typeof module !== 'undefined' && module.exports) module.exports = AI;
})(globalThis);
</script>
<script>/* OvaTwin — توأم رقمي تعليمي لسيناريوهات «ماذا لو؟» (نمط الحياة/الالتزام).
   - الوزن: نموذج توازن طاقة مبسّط (افتراض: ~22 سعراً لكل كغ لكل يوم، ثابت زمني ~365 يوماً، نطاق ±30% افتراضي).
   - سكر/إنسولين الصيام: نطاقات مستخرجة من مراجعة Domecq 2013 (برامج نمط الحياة)، تتدرّج خلال ~90 يوماً (افتراض).
   - لا يتنبأ بالدورة الشهرية ولا بالأعراض كمياً. أثر أي دواء/مكمل يدخله الطبيب كافتراض صريح. */
(function (g) {
  'use strict';
  const U = g.OvaUtil;
  const T = {};
  T.PARAMS = {
    kcalPerKgDay: 22, tauWeightDays: 365, tauMetabolicDays: 90, bandFrac: 0.3,
    fg: { mid: -2.3, lo: -4.5, hi: -0.1 }, fi: { mid: -2.1, lo: -3.3, hi: -1.0 },
    METnet: 2.5
  };

    const adh = U.clamp(p.adherence == null ? 1 : p.adherence, 0, 1);
    const actKcal = (p.activityMinPerWeek || 0) / 7 * 0.0175 * P.METnet * p.weightKg;

    const lifestyle = (p.deficitKcal || 0) > 0 || (p.activityMinPerWeek || 0) > 0;

      const r = 1 - Math.exp(-d / P.tauMetabolicDays);

      out.weight.lo.push(U.round(p.weightKg - loss * (1 + P.bandFrac), 2));

      out.fg.lo.push(U.round(p.fastingGlucose + P.fg.lo * f + ass, 1));
      out.fg.hi.push(U.round(p.fastingGlucose + P.fg.hi * f + ass, 1));

        out.fi.mid.push(U.round(p.fastingInsulin + P.fi.mid * f, 1));
        out.fi.lo.push(U.round(p.fastingInsulin + P.fi.lo * f, 1));
        out.fi.hi.push(U.round(p.fastingInsulin + P.fi.hi * f, 1));

      homaStart: p.fastingInsulin != null ? U.round((p.fastingGlucose / 18) * p.fastingInsulin / 22.5, 2) : null,
      homaEnd: out.homa ? out.homa[last] : null
    };
    out.notes = [
      'نموذج تعليمي: يعرض نطاقاً محتملاً لا وعداً.',
      'جودة الدليل في مراجعات نمط الحياة منخفضة (Cochrane) لذا النطاقات واسعة.',

      (p.fgAssumption ? 'يتضمن افتراضاً أدخله الطبيب لأثر دوائي على سكر الصيام: ' + p.fgAssumption + ' ملغ/دل — ليس تنبؤاً.' : 'لا أثر دوائي مفترض في هذا السيناريو.')
    ];

  };

    const b = T.simulate(Object.assign({}, base, plan));
    return { baseline: a, scenario: b };
  };

  T.scenarios = function (base) {
    return [
      { id: 'current', name: 'استمرار الوضع الحالي', plan: { deficitKcal: 0, activityMinPerWeek: 0, adherence: 1 } },
      { id: 'diet', name: 'نظام غذائي (عجز 300 سعر، التزام 80%)', plan: { deficitKcal: 300, activityMinPerWeek: 0, adherence: 0.8 } },

      { id: 'full', name: 'التزام كامل بالنظام والنشاط', plan: { deficitKcal: 300, activityMinPerWeek: 150, adherence: 1 } }
    ].map(s => Object.assign({ result: T.simulate(Object.assign({}, base, s.plan)) }, s));

  if (typeof module !== 'undefined' && module.exports) module.exports = T;

  };

<script>/* OvaBody — توأم الجسم ثلاثي الأبعاد: قياسات المريضة ← مجسّم سلكي يشبه نسبها، وإسقاط زمني لتغيّر القياسات

<script>/* OvaFertility — تقدير الدورة ونافذة الخصوبة بطريقة التقويم + اختبار LH.
   تقدير فقط: ليس وسيلة لمنع الحمل ولا تشخيصاً. في المتلازمة تكون الدورات غير منتظمة فتتّسع حدود عدم اليقين. */
(function (g) {
  'use strict';
  const U = g.OvaUtil, D = U.DAY;
  const F = {};
  const T = k => U.dayKeyToT(k);
  const diff = (a, b) => Math.round((T(b) - T(a)) / D);
  const add = (k, n) => U.dayKey(T(k) + n * D + 12 * U.HOUR - 12 * U.HOUR);
  F.add = add; F.diff = diff;

  // starts: مفاتيح أيام بدايات الدورات (مرتبة أو لا)، logs: [{date, lh:'pos'|'neg'|'', mucus}]
  F.analyze = function (starts, logs, nowT, o) {
    o = o || {};
    const today = U.dayKey(nowT);
    const S = Array.from(new Set(starts.filter(k => k <= today))).sort();
    const lens = []; for (let i = 1; i < S.length; i++) lens.push(diff(S[i - 1], S[i]));
    const recent = lens.slice(-6), n = recent.length;
    const mean = n ? recent.reduce((a, b) => a + b, 0) / n : null;
    const sd = n >= 2 ? Math.sqrt(recent.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (n - 1)) : null;
    const res = { today, starts: S, lens: recent, n, mean: mean == null ? null : Math.round(mean * 10) / 10, sd: sd == null ? null : Math.round(sd * 10) / 10 };
    if (!S.length) { res.empty = true; return res; }
    const last = S[S.length - 1];
    res.lastStart = last; res.dayOfCycle = diff(last, today) + 1; res.daysSinceLast = diff(last, today);
    // عدم الانتظام (إرشاد 2023: <21 أو >35 يوماً، أو دورة >90 يوماً)
    const reasons = [];
    if (mean != null && mean > 35) reasons.push('متوسط طول الدورة ' + res.mean + ' يوماً (أكثر من 35).');
    if (mean != null && mean < 21) reasons.push('متوسط طول الدورة ' + res.mean + ' يوماً (أقل من 21).');
    if (recent.some(x => x > 90)) reasons.push('وُجدت دورة تجاوزت 90 يوماً.');
    if (sd != null && sd > 7) reasons.push('تباين كبير بين الدورات (الانحراف المعياري ' + res.sd + ' أيام).');
    res.irregular = reasons.length > 0; res.reasons = reasons;
    res.longGap = res.daysSinceLast > 90;
    res.insufficient = n < 2;
    res.confidence = (res.irregular || res.insufficient) ? 'low' : 'medium';
    const base = mean != null ? Math.round(mean) : (o.defaultLen || 28);
    const hw = Math.max(3, Math.round(sd != null ? sd : 5));
    res.nextStart = { key: add(last, base), lo: add(last, base - hw), hi: add(last, base + hw), hw };
    res.late = today > res.nextStart.hi;
    // الإباضة: LH موجب في الدورة الحالية يُرجِّح التاريخ؛ وإلا تقويم (بداية القادمة − 14)
    const lhPos = (logs || []).filter(l => l.lh === 'pos' && l.date >= last && l.date <= today).map(l => l.date).sort();
    let ov;
    if (lhPos.length) { const d0 = lhPos[lhPos.length - 1]; ov = { key: add(d0, 1), lo: add(d0, 1), hi: add(d0, 2), basis: 'LH', lhDate: d0 }; }
    else { const w = Math.round(Math.sqrt(hw * hw + 4)); ov = { key: add(res.nextStart.key, -14), lo: add(res.nextStart.key, -14 - w), hi: add(res.nextStart.key, -14 + w), basis: 'calendar' }; }
    res.ovulation = ov;
    res.fertile = { from: add(ov.key, -5), to: ov.key, broadFrom: add(ov.lo, -5), broadTo: ov.hi };
    // الطور اليوم
    let phase;
    if (res.dayOfCycle <= 5) phase = 'menses';
    else if (today >= res.fertile.from && today <= res.fertile.to) phase = 'fertile';
    else if (today < res.fertile.from) phase = 'follicular';
    else if (today <= res.nextStart.hi) phase = 'luteal';
    else phase = 'late';
    res.phase = phase;
    res.lhPositiveRecent = lhPos.length > 0;
    return res;
  };
  F.PHASE_AR = { menses: 'أيام الدورة', follicular: 'الطور الجريبي (قبل النافذة)', fertile: 'نافذة الخصوبة المقدّرة', luteal: 'بعد الإباضة المقدّرة', late: 'متأخرة عن المتوقع' };

  // شريط تقويم: كل يوم من بداية الدورة الحالية
  F.calendar = function (a, bleedDays) {

    const L = Math.max(Math.round(a.mean || 28) + 8, 36), out = [], bd = new Set(bleedDays || []);

<script>/* OvaEngine — حالة التطبيق، تقدّم الزمن المحاكى، بيانات العرض التجريبي، والسياق للمساعد */

      range: { low: 70, high: 140 }, fastingThreshold: 100,

    return r;
  };
  E.provisionDoctor = async function (env, now) {
    const kp = await C.generateKeyPair();
    env.S.doctor = { name: 'د. ريم (طبيبة افتراضية)', keyId: kp.keyId, publicJwk: kp.publicJwk, privateJwk: kp.privateJwk };
    env.gate.provisionKey(kp.keyId, kp.publicJwk, now);
  };

  // ---- مختبر الأمان: كل هجوم يُرجع {name, expected, got, pass} ----
  E.attacks = [
    { id: 'replay', name: 'إعادة إرسال أمر قديم', expected: ['REPLAY_NONCE'] },
    { id: 'tamper', name: 'تعديل الجرعة بعد التوقيع', expected: ['BAD_SIGNATURE'] },
    { id: 'expired', name: 'أمر منتهي الصلاحية', expected: ['EXPIRED'] },
    { id: 'revoked', name: 'مفتاح طبيب مُلغى', expected: ['KEY_REVOKED'] },
    { id: 'unknown', name: 'مفتاح غير معروف للجهاز', expected: ['UNKNOWN_KEY'] },
    { id: 'overdose', name: 'جرعة فوق الحد الأقصى للجرعة الواحدة', expected: ['DOSE_OVER_SINGLE_MAX'] },
    { id: 'limit', name: 'جرعة خارج السقف اليومي/الفاصل الزمني', expected: ['DAILY_CAP_EXCEEDED', 'MIN_INTERVAL'] },
    { id: 'ai', name: 'أمر من الذكاء الاصطناعي بلا توقيع', expected: ['UNSIGNED'] },
    { id: 'wrongdev', name: 'أمر موقَّع لجهاز آخر', expected: ['WRONG_DEVICE'] },
    { id: 'rollback', name: 'خطة بإصدار أقدم (رجوع للخلف)', expected: ['PLAN_ROLLBACK'] },
    { id: 'audit', name: 'العبث بسجل التدقيق', expected: ['CHAIN_BROKEN'] }
  ];
  E.runAttack = async function (env, id, now) {
    const { S, gate } = env;
    const def = E.attacks.find(a => a.id === id);
    let r;
    const fresh = async (o, t) => E.issueCommand(env, Object.assign({ doseUL: 10 }, o), t || now);
    if (id === 'replay') {
      // أمر صالح أولاً ثم إعادته حرفياً
      const e = await fresh({ doseUL: 5 });
      await gate.execute(e, now);
      r = await gate.execute(e, now + U.MIN);
    } else if (id === 'tamper') {
      const e = await fresh({ doseUL: 10 }); e.cmd = Object.assign({}, e.cmd, { doseUL: 45 });
      r = await gate.execute(e, now);
    } else if (id === 'expired') {
      const e = await fresh({ issuedAt: now - 20 * U.MIN, expiresAt: now - 10 * U.MIN });
      r = await gate.execute(e, now);
    } else if (id === 'revoked') {
      const kp = await C.generateKeyPair(); const ks = { keyId: kp.keyId, privateJwk: kp.privateJwk };
      gate.provisionKey(kp.keyId, kp.publicJwk, now); gate.revokeKey(kp.keyId, now);
      r = await gate.execute(await E.issueCommand(env, { doseUL: 10 }, now, ks), now);
    } else if (id === 'unknown') {
      const kp = await C.generateKeyPair();
      r = await gate.execute(await E.issueCommand(env, { doseUL: 10 }, now, { keyId: kp.keyId, privateJwk: kp.privateJwk }), now);
    } else if (id === 'overdose') {
      r = await gate.execute(await fresh({ doseUL: 45 }), now);
    } else if (id === 'limit') {
      const item = S.gate.plan && S.gate.plan.items[0];
      const room = item ? item.dailyCapUL - gate.deliveredToday(item.substance, now) : 0;
      // جرعة ضمن الحد الواحد لكنها تتجاوز المتبقي أو تخالف الفاصل
      r = await gate.execute(await fresh({ doseUL: item ? Math.min(item.singleMaxUL, Math.max(item.singleMaxUL, room + 1)) : 10 }), now);
    } else if (id === 'ai') {
      r = await gate.execute({ cmd: { cmdId: 'AI-1', keyId: 'ai-engine', substance: E.SUBSTANCE, doseUL: 10 }, sig: null }, now);
    } else if (id === 'wrongdev') {
      const e = await SEC.signCmd(S.doctor.privateJwk, SEC.nextCmd({ keyId: S.doctor.keyId, deviceId: 'OVA-POD-9999', patientId: S.patient.id, seq: ++S.seq, now }, { substance: E.SUBSTANCE, doseUL: 10 }));
      r = await gate.execute(e, now);
    } else if (id === 'rollback') {
      const cur = S.gate.plan; const old = Object.assign({}, cur, { version: cur.version, planId: 'OLD' });
      r = await gate.installPlan(await SEC.signPlan(S.doctor.privateJwk, old), now);
    } else if (id === 'audit') {
      const clone = JSON.parse(JSON.stringify(S.gate.audit));
      if (clone.length > 3) clone[Math.floor(clone.length / 2)].detail = 'تم العبث';
      const v = SEC.verifyChain(clone);
      r = { ok: false, code: v.ok ? 'CHAIN_OK' : 'CHAIN_BROKEN', label: v.ok ? 'السلسلة سليمة' : 'اكتشاف العبث عند السجل #' + v.brokenAt, brokenAt: v.brokenAt };
    }
    const got = r.ok === false || r.code ? (r.code || r.status) : 'ACCEPTED';
    return { id, name: def.name, expected: def.expected, got, label: r.label || '', pass: def.expected.includes(got) };
  };

  // ---- أدوات مشتقة ----
  E.nextDose = function (plan, now) {
    if (!plan || now > plan.expiresAt) return null;
    let best = null;
    for (let d = 0; d < 2; d++) {
      const base = U.dayStart(now) + d * U.DAY;
      for (const it of plan.items) for (const tm of it.times) {
        const due = base + U.parseHM(tm);
        if (due > now && (!best || due < best.t)) best = { t: due, substance: it.substance, doseUL: it.doseUL, when: U.fmtDT(due) };
      }
    }
    return best;
  };
  E.latest = (S, type) => { for (let i = S.readings.length - 1; i >= 0; i--) if (S.readings[i].type === type) return S.readings[i]; return null; };

  E.derive = function (env, now) {
    const { S, device, gate } = env;
    now = now || S.clock.now;
    const plan = gate.s.plan;
    const stats7 = AI.glucoseStats(S.readings, now - 7 * U.DAY, now, S.range);
    const stats1 = AI.glucoseStats(S.readings, now - U.DAY, now, S.range);
    const quality = AI.signalQuality(S.readings, now, 6);
    const bleeding = AI.bleedingAnalysis(S.bleeding, now);
    const fastDays = AI.fastingByDay(S.readings.filter(r => r.t > now - 7 * U.DAY));
    const fastingHighDays = fastDays.filter(f => f.mean > S.fastingThreshold).length;
    const age = device.ageDays(now);
    const calibratedThisPatch = !!(S.device.calib && S.device.patchAppliedAt && S.device.calib.t >= S.device.patchAppliedAt);
    const bloodNeed = AI.bloodTestNeed({ now, lastLabT: S.labs.lastLabT, labIntervalDays: S.labs.labIntervalDays, patchAgeDays: age, calibratedThisPatch, quality, stats: stats7, fastingHighDays, bleedingUrgent: bleeding.urgent });
    const alerts = device.alerts(now);
    const adherencePct = AI.adherence(plan, gate.s.deliveries, now, 7);
    const lg = E.latest(S, 'glucose');
    const wRead = E.latest(S, 'weight');
    const weight = wRead ? wRead.value : S.patient.weightKg;
    const fgBase = fastDays.length ? U.round(U.mean(fastDays.map(f => f.mean)), 1) : 95;
    const twinBase = { weightKg: weight, heightCm: S.patient.heightCm, fastingGlucose: fgBase, fastingInsulin: S.labs.fastingInsulin, horizonDays: S.twin.horizon };
    const tw = S.twin;
    const twinRes = TW.simulate(Object.assign({}, twinBase, { deficitKcal: tw.deficit, activityMinPerWeek: tw.act, adherence: tw.adh / 100, fgAssumption: tw.fgAssumption }));
    const corr = AI.symptomCorrelation(S.symptoms, S.readings);
    const diet = AI.dietPlan({ weightKg: weight, heightCm: S.patient.heightCm, age: S.patient.age, activity: S.patient.activity, goal: S.patient.goal }, Math.floor(now / U.DAY));
    const starts = bleeding.episodes.filter(e => !e.spottingOnly).map(e => e.start);
    const fert = F.analyze(starts, S.fertility, now);
    const hM = S.patient.heightCm / 100, bmiV = hM > 0 ? weight / (hM * hM) : null;
    const bmi = bmiV == null ? null : { v: U.round(bmiV, 1), cat: bmiV < 18.5 ? 'نحافة' : bmiV < 25 ? 'وزن طبيعي' : bmiV < 30 ? 'زيادة وزن' : 'سمنة' };
    const review = AI.dosePlanReview({ plan, stats: stats7, quality, adherencePct, deviceAlerts: alerts });
    return {
      name: S.patient.name, now, fert, bmi, doctorNote: S.doctorNote, plan, stats7, stats1, quality, bleeding, fastingHighDays, bloodNeed, alerts, adherencePct, corr, diet, review, weight, twinBase, twinRes,
      latestGlucose: lg ? { value: lg.value, q: lg.q, when: U.hhmm(lg.t) } : null,
      latestHM1: E.latest(S, 'hm1'), nextDose: E.nextDose(plan, now),
      deliveredTodayUL: plan ? gate.deliveredToday(plan.items[0].substance, now) : null,
      deviceBrief: 'البطارية ' + U.round(S.device.batteryPct) + '%، الخزان ' + U.round(S.device.reservoirUL) + ' µL.',
      twin: { name: 'نظام + نشاط', horizonDays: twinRes.summary.horizonDays, weightEnd: twinRes.summary.weightEnd, weightBand: twinRes.summary.weightBand, fgEnd: twinRes.summary.fgEnd, fgBand: twinRes.summary.fgBand },
      meds: S.patient.meds, pregnant: S.patient.pregnant, hypertension: S.patient.hypertension
    };
  };

  // ---- بيانات العرض التجريبي (تركيبية) ----
  E.seedDemo = async function (now) {
    const S = E.newState(0), env = E.attach(S);
    const today = U.dayStart(now), start = today - 14 * U.DAY;
    S.clock.now = start; S.clock.lastT = start; S.demo = true;
    const rng = U.rng(77);
    // وجبات
    const dayCarbs = {};
    for (let d = 0; d <= 14; d++) {
      const ds = start + d * U.DAY;
      const add = (h, name, c) => { const t = ds + h * U.HOUR + Math.floor(rng() * 20) * U.MIN; if (t <= now) { S.meals.push({ t, name, carbs: c }); dayCarbs[U.dayKey(ds)] = (dayCarbs[U.dayKey(ds)] || 0) + c; } };
      add(8, 'فطور', 35 + Math.round(rng() * 25));
      add(13.5, 'غداء', 55 + Math.round(rng() * 35));
      add(20, 'عشاء', 40 + Math.round(rng() * 30));
      if (rng() < 0.5) add(16.5, 'وجبة خفيفة', 20 + Math.round(rng() * 25));
    }
    S.meals.sort((a, b) => a.t - b.t);
    await E.provisionDoctor(env, start);
    const spec = { issuedAt: start - U.HOUR, expiresAt: now + 60 * U.DAY, doseUL: 25, times: ['07:00', '12:00', '17:00', '22:00'], singleMaxUL: 30, dailyCapUL: 110, minIntervalMin: 180 };
    const pr = await E.signAndInstallPlan(env, spec, start);
    if (!pr.ok) throw new Error('plan install failed ' + pr.code);
    // الرقعة 1 (يوم 0) والرقعة 2 (يوم 7)
    E.advance(env, start + 6.5 * U.HOUR); env.device.applyPatch(start + 6.5 * U.HOUR);
    E.advance(env, start + 3 * U.DAY + 8 * U.HOUR);
    E.addReading(env, 'lab_glucose', 92); // معايرة بقياس دم
    E.advance(env, start + 7 * U.DAY + 6.5 * U.HOUR); env.device.applyPatch(start + 7 * U.DAY + 6.5 * U.HOUR);
    gate_note(env, start + 7 * U.DAY + 6.5 * U.HOUR);
    E.advance(env, now);
    // أعراض يومية (ترتبط جزئياً بكربوهيدرات اليوم — بيانات تركيبية)
    for (let d = 0; d < 14; d++) {
      const k = U.dayKey(start + d * U.DAY), c = dayCarbs[k] || 120;
      const sc = (base) => U.clamp(Math.round(base + (c - 140) / 70 + (rng() - 0.5) * 1.6), 0, 3);
      S.symptoms.push({ date: k, acne: sc(1), hirsutism: U.clamp(Math.round(1 + (rng() - 0.5) * 1.2), 0, 3), fatigue: sc(1), mood: sc(1), cramps: U.clamp(Math.round(rng() * 1.5), 0, 3) });
    }
    // نزيف: دورتان (طول الدورة 39 يوماً)
    const bd = (offset, o) => S.bleeding.push(Object.assign({ date: U.dayKey(today + offset * U.DAY) }, o));
    const ep = (startOff, plan) => plan.forEach((o, i) => bd(startOff + i, o));
    ep(-54, [{ pads: { m: 3 } }, { pads: { m: 4, s: 1 }, clotsS: 1 }, { pads: { m: 3 } }, { pads: { l: 3 } }, { pads: { l: 2 } }]);
    ep(-15, [{ pads: { m: 3 } }, { pads: { m: 3, s: 1 } }, { pads: { m: 2, l: 2 } }, { pads: { l: 3 } }, { pads: { l: 2 } }, { spotting: true, pads: { l: 1 } }]);
    // وزن ومعطيات مخبرية
    S.readings.push({ t: start + 2 * U.HOUR, type: 'weight', value: 78.4, src: 'manual' }, { t: start + 7 * U.DAY + 2 * U.HOUR, type: 'weight', value: 78.1, src: 'manual' }, { t: today + 2 * U.HOUR <= now ? today + 2 * U.HOUR : now - U.HOUR, type: 'weight', value: 77.8, src: 'manual' });
    S.labs = { lastLabT: now - 100 * U.DAY, fastingInsulin: 14, hba1c: 5.6, labIntervalDays: 90 };
    S.clock.now = now; S.onboarded = false;
    return env;
  };
  function gate_note(env, t) { env.gate.audit(t, 'DEVICE', 'PATCH_APPLIED', 'رقعة جديدة'); }

  g.OvaEngine = E;
  if (typeof module !== 'undefined' && module.exports) module.exports = E;
})(globalThis);
</script>
<script>/* واجهة OvaSense — عرض وتفاعل. المنطق في OvaEngine/OvaAI/OvaSecurity. */
(function () {
  'use strict';
  const U = OvaUtil, E = OvaEngine, AI = OvaAI, SEC = OvaSecurity, KB = OvaKB, TW = OvaTwin, CH = OvaChat, KT = OvaKitchen, BD = OvaBody;

  let env = null, tab = 'home', flash = {}, timer = null, dietSeed = 0, tourI = -1;

  const TABS = [['home', 'الرئيسية'], ['measure', 'قياساتي'], ['food', 'الغذاء'], ['symptoms', 'الأعراض والنزيف'], ['fertility', 'الخصوبة والدورة'], ['twin', 'التوأم الرقمي'], ['chat', 'المساعد'], ['doctor', 'الطبيب'], ['device', 'الجهاز'], ['lab', 'مختبر الأمان'], ['about', 'عن المشروع']];

  // ---------- حفظ/تحميل ----------
  function save() { try { localStorage.setItem(LS, JSON.stringify(env.S)); } catch (e) { /* التخزين غير متاح */ } }
  function load() { try { const j = localStorage.getItem(LS); if (j) { const s = JSON.parse(j); if (s && s.v === 1 && s.device && s.gate) return s; } } catch (e) { } return null; }

  // ---------- أدوات واجهة ----------
  const fl = k => flash[k] ? '<div class="alert ' + (flash[k].kind || 'info') + '" role="status">' + flash[k].html + '</div>' : '';
  const setFlash = (k, html, kind) => { flash[k] = { html, kind }; };
  const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const num = id => Number(val(id));
  const chk = id => { const e = document.getElementById(id); return !!(e && e.checked); };
  const pill = (t, k) => '<span class="pill ' + (k || '') + '">' + esc(t) + '</span>';
  const tile = (label, v, sub) => '<div class="tile"><small>' + esc(label) + '</small><div class="v">' + v + '</div><div class="s">' + (sub || '') + '</div></div>';

  function chart(o) {
    const W = o.w || 640, H = o.h || 220, m = { l: 42, r: 10, t: 10, b: 24 };
    const x = v => m.l + (v - o.x0) / (o.x1 - o.x0) * (W - m.l - m.r);
    const y = v => H - m.b - (v - o.y0) / (o.y1 - o.y0) * (H - m.t - m.b);
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || '') + '">';
    for (let i = 0; i <= 4; i++) { const v = o.y0 + (o.y1 - o.y0) * i / 4; s += '<line class="gridl" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (m.l - 4) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + U.round(v, o.yd || 0) + '</text>'; }
    (o.xt || []).forEach(t => { s += '<text x="' + x(t.v) + '" y="' + (H - 6) + '" text-anchor="' + (t.v >= o.x1 ? 'end' : t.v <= o.x0 ? 'start' : 'middle') + '">' + esc(t.l) + '</text>'; });
    if (o.range) s += '<rect class="rng" x="' + m.l + '" width="' + (W - m.l - m.r) + '" y="' + y(o.range.high) + '" height="' + Math.max(0, y(o.range.low) - y(o.range.high)) + '"/>';
    (o.bands || []).forEach(b => {
      const top = b.hi.map(p => x(p[0]) + ',' + y(p[1])).join(' '), bot = b.lo.slice().reverse().map(p => x(p[0]) + ',' + y(p[1])).join(' ');
      s += '<polygon class="band" points="' + top + ' ' + bot + '"/>';
    });
    (o.lines || []).forEach(l => { if (l.pts.length) s += '<polyline class="' + l.cls + '" points="' + l.pts.map(p => x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join(' ') + '"/>'; });
    (o.dots || []).forEach(d => { s += '<circle class="' + d.cls + '" cx="' + x(d.x) + '" cy="' + y(d.y) + '" r="' + (d.r || 3.5) + '"><title>' + esc(d.title || '') + '</title></circle>'; });
    return s + '</svg>';
  }

  // ---------- جدول «ماذا يقرأ الجهاز» ----------
  const READ_TABLE = [
    ['جلوكوز السائل الخلالي', 'يقيسه الجهاز', 'كل 5 دقائق', 'ملغ/دل', 'مقدَّر وليس دماً مباشراً؛ يتأخر 5–10 دقائق ويُعايَر بقياس دم.'],
    ['مؤشر هرموني (HM1)', 'يقيسه الجهاز', 'كل ساعة', 'وحدات اعتباطية', 'المؤشر الفعلي يُحدَّد بعد مرحلة التحقق؛ لا يُشخّص.'],
    ['التدفق المقاس (حساس التدفق)', 'يقيسه الجهاز', 'عند كل جرعة', 'µL', 'مقارنة بالمأمور به؛ انحراف أكثر من 20% يوقف التوصيل.'],
    ['الخزان، البطارية، عمر الرقعة، جودة الإشارة', 'يقيسه الجهاز', 'مستمر', '% / µL / يوم', 'تنبيهات استباقية للاستبدال والمعايرة.'],
    ['الوزن، الضغط، قياس دم مرجعي', 'تُدخله المريضة', 'عند الحاجة', 'كغ / ملم زئبق / ملغ/دل', 'القياس المرجعي يعاير المستشعر.'],
    ['الوجبات، الأعراض، النزيف', 'تُدخله المريضة', 'يومياً', 'جم كربوهيدرات / 0–3 / PBAC', 'أساس الارتباطات وتحليل أنماط النزيف.'],
    ['التحاليل المخبرية، الخطة، الحدود', 'يُدخله الطبيب', 'دورياً', '—', 'الخطة موقَّعة رقمياً ويفرضها الجهاز.'],
    ['الوقت ضمن النطاق، حاجة التحليل، أنماط النزيف، الارتباطات', 'يستنتجه الذكاء الاصطناعي', 'مستمر', '—', 'دعم قرار فقط؛ لا ينفّذ جرعات.']
  ];
  const readTable = () => '<div class="scroll"><table><thead><tr><th>القيمة</th><th>المصدر</th><th>التكرار</th><th>الوحدة</th><th>ملاحظة</th></tr></thead><tbody>' + READ_TABLE.map(r => '<tr>' + r.map((c, i) => '<td>' + (i === 1 ? pill(c, c.startsWith('يقيس') ? 'ok' : c.startsWith('يستنتج') ? 'info' : '') : esc(c)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';

  // ---------- العروض ----------
  function arrow(S) {
    const g = S.readings.filter(r => r.type === 'glucose');
    if (g.length < 7) return '→';
    const a = g[g.length - 1].value, b = g[g.length - 7].value, d = a - b;
    return d > 10 ? '↑' : d > 4 ? '↗' : d < -10 ? '↓' : d < -4 ? '↘' : '→';
  }
  function vHome() {
    const S = env.S, d = E.derive(env), now = S.clock.now;
    const g = d.latestGlucose, s7 = d.stats7;
    const w0 = now - U.DAY;
    const pts = S.readings.filter(r => r.type === 'glucose' && r.t >= w0).map(r => [r.t, r.value]);
    const maxY = Math.max(180, ...pts.map(p => p[1]) , 0) + 10;
    const xt = []; for (let h = 0; h <= 24; h += 6) xt.push({ v: w0 + h * U.HOUR, l: U.hhmm(w0 + h * U.HOUR) });
    const dots = env.gate.s.deliveries.filter(x => x.t >= w0).map(x => ({ x: x.t, y: 52, cls: 'd1', title: 'جرعة ' + x.deliveredUL + ' µL ' + U.hhmm(x.t) }))
      .concat(S.meals.filter(m => m.t >= w0 && m.t <= now).map(m => ({ x: m.t, y: maxY - 4, cls: 'd2', r: 4, title: m.name + ' ' + m.carbs + ' جم ' + U.hhmm(m.t) })));
    const bn = d.bloodNeed;
    const alerts = d.alerts.map(a => '<div class="alert ' + (a.lvl === 'danger' ? 'danger' : a.lvl === 'warn' ? 'warn' : 'info') + '">' + esc(a.text) + '</div>').join('');
    const f = d.fert, ds0 = S.device, due = S.labs.lastLabT ? Math.ceil(S.labs.labIntervalDays - (now - S.labs.lastLabT) / U.DAY) : null;
    const rem = [];
    if (due != null) rem.push(due <= 0 ? 'موعد تحليل الدم متأخر (الفاصل ' + S.labs.labIntervalDays + ' يوماً).' : 'تحليل الدم القادم بعد ' + due + ' يوماً.');
    if (f && !f.empty && f.phase === 'fertile') rem.push('أنتِ ضمن نافذة الخصوبة المقدّرة؛ إن كنتِ تتابعين LH فسجّلي اختبار اليوم.');
    if (f && !f.empty && f.late) rem.push('الدورة متأخرة عن المتوقع (اليوم ' + f.dayOfCycle + '). سجّلي النزيف عند بدئه.');
    if (ds0.patchApplied && !(ds0.calib && ds0.calib.t >= ds0.patchAppliedAt)) rem.push('لم تُعايَر الرقعة الحالية بقياس دم مرجعي بعد.');
    const note = d.doctorNote ? '<div class="alert info"><b>رسالة الطبيب</b> · ' + U.fmtDT(d.doctorNote.t) + '<br>' + esc(d.doctorNote.text) + '</div>' : '';
    const stop = ds0.faultLatched ? '<button class="btn" data-act="clearFault">استئناف التوصيل</button>' : '<button class="btn dng" data-act="estop" aria-label="إيقاف التوصيل فوراً">⏹ إيقاف التوصيل فوراً</button>';
    return '<h2>أهلاً، ' + esc(S.patient.name) + '</h2>' + fl('home') + alerts + note +
      '<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><div><b>الإيقاف الطارئ</b><div class="small mut">يوقف أي جرعة قادمة فوراً. الاستئناف يدوي، ويُسجَّل الحدث في سجل التدقيق.</div></div>' + stop + '</div>' +
      '<div class="grid g3" style="margin-top:12px">' +
      tile('الجلوكوز الحالي (سائل خلالي)', g ? g.value + ' <span class="small">ملغ/دل ' + arrow(S) + '</span>' : '—', g ? 'عند ' + g.when + (g.q != null ? ' · جودة ' + g.q : '') : 'لا قراءة') +
      tile('الوقت ضمن النطاق (7 أيام)', s7.n ? s7.tirPct + '%' : '—', s7.n ? 'النطاق ' + S.range.low + '–' + S.range.high + ' · المتوسط ' + s7.mean : '') +
      tile('الجرعة القادمة', d.nextDose ? d.nextDose.doseUL + ' µL' : '—', d.nextDose ? esc(d.nextDose.when) : 'لا خطة') +
      tile('الالتزام (7 أيام)', d.adherencePct != null ? d.adherencePct + '%' : '—', 'جرعات منفّذة/مجدولة') +
      tile('جودة الإشارة', d.quality != null ? d.quality : '—', d.quality != null && d.quality < 0.6 ? 'منخفضة: عايري' : 'آخر 6 ساعات') +
      tile('كتلة الجسم BMI', d.bmi ? d.bmi.v : '—', d.bmi ? esc(d.bmi.cat) + ' · ' + d.weight + ' كغ' : '') +
      tile('الدورة', f && !f.empty ? 'يوم ' + f.dayOfCycle : '—', f && !f.empty ? esc(OvaFertility.PHASE_AR[f.phase]) : 'سجّلي أول يوم نزيف') +
      tile('هل أحتاج تحليل دم؟', pill(bn.label, bn.level === 'high' ? 'danger' : bn.level === 'medium' ? 'warn' : 'ok'), 'الدرجة ' + bn.score + '/100') +
      '</div>' +
      (rem.length ? '<div class="card" style="margin-top:12px"><h3>تذكيرات</h3><ul>' + rem.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul></div>' : '') +
      '<div class="card" style="margin-top:12px"><h3>الجلوكوز خلال 24 ساعة</h3>' +
      chart({ label: 'الجلوكوز خلال 24 ساعة', x0: w0, x1: now, y0: 50, y1: maxY, range: S.range, xt, lines: [{ cls: 'l1', pts: pts.filter((p, i) => i % 2 === 0) }], dots }) +
      '<p class="small mut">المنطقة الخضراء = النطاق الذي حدده الطبيب · النقاط الوردية = جرعات الجهاز · الصفراء = وجبات.</p></div>' +
      '<div class="grid g2" style="margin-top:12px"><div class="card"><h3>لماذا هذا التقدير؟</h3>' + (bn.reasons.length ? '<ul>' + bn.reasons.map(r => '<li>' + esc(r.text) + '</li>').join('') + '</ul>' : '<p>لا أسباب تستدعي التحليل الآن.</p>') +
      '<div class="row"><button class="btn sec sm" data-act="goto" data-v="measure">سجّلي قياس دم مرجعي</button></div></div>' +
      '<div class="card"><h3>مراجعة الذكاء الاصطناعي للخطة</h3>' + d.review.map(r => '<div class="alert info">' + esc(r.text) + (r.requiresDoctor ? ' <span class="small mut">(يتطلب موافقة وتوقيع الطبيب)</span>' : '') + '</div>').join('') + '<p class="small mut">الاقتراحات ضمن حدود الخطة فقط ولا تُنفَّذ تلقائياً.</p></div></div>' +
      '<details class="card" style="margin-top:12px"><summary><b>ماذا يقرأ الجهاز بالضبط؟</b></summary>' + readTable() + '</details>';
  }

  function vMeasure() {
    const S = env.S;
    const man = S.readings.filter(r => r.src === 'manual').slice(-12).reverse();
    const lbl = { weight: 'وزن (كغ)', bp: 'ضغط (ملم زئبق)', lab_glucose: 'قياس دم مرجعي (ملغ/دل)' };
    return '<h2>قياساتي</h2>' + fl('measure') +
      '<div class="card"><h3>تسجيل قياس جديد</h3><div class="row">' +
      '<label>النوع<select id="m-type"><option value="weight">الوزن (كغ)</option><option value="bp">الضغط (انقباضي/انبساطي)</option><option value="lab_glucose">قياس دم مرجعي — يعاير المستشعر</option></select></label>' +
      '<label>القيمة<input id="m-val" type="number" step="0.1" inputmode="decimal" style="width:110px"></label>' +
      '<label>انبساطي (للضغط)<input id="m-dia" type="number" step="1" inputmode="numeric" style="width:110px"></label>' +
      '<button class="btn" data-act="addMeasure">حفظ</button></div>' +
      '<p class="small mut">القياس المرجعي للجلوكوز يُستخدم لمعايرة قراءة السائل الخلالي ويرفع جودة الإشارة.</p></div>' +
      '<div class="card" style="margin-top:12px"><h3>آخر القياسات اليدوية</h3>' + (man.length ? '<div class="scroll"><table><thead><tr><th>الوقت</th><th>النوع</th><th>القيمة</th></tr></thead><tbody>' + man.map(r => '<tr><td>' + U.fmtDT(r.t) + '</td><td>' + esc(lbl[r.type] || r.type) + '</td><td>' + r.value + (r.dia ? '/' + r.dia : '') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="mut">لا توجد قياسات يدوية بعد.</p>') +
      '<div class="row"><button class="btn sec sm" data-act="exportCsv">تنزيل القراءات (CSV)</button></div></div>';
  }

  function vFood() {
    const S = env.S, d = E.derive(env), p = S.patient, plan = AI.dietPlan({ weightKg: d.weight, heightCm: p.heightCm, age: p.age, activity: p.activity, goal: p.goal }, Math.floor(S.clock.now / U.DAY) + dietSeed);
    return '<h2>الغذاء الشخصي</h2>' + fl('food') +
      '<div class="card"><h3>ملفي</h3><div class="row">' +
      '<label>الطول (سم)<input id="p-h" type="number" value="' + p.heightCm + '" style="width:90px"></label>' +
      '<label>العمر<input id="p-a" type="number" value="' + p.age + '" style="width:80px"></label>' +
      '<label>النشاط<select id="p-act">' + [['low', 'خفيف'], ['moderate', 'متوسط'], ['high', 'عالٍ']].map(o => '<option value="' + o[0] + '"' + (p.activity === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>' +
      '<label>الهدف<select id="p-goal"><option value="maintain"' + (p.goal === 'maintain' ? ' selected' : '') + '>تثبيت الوزن</option><option value="lose"' + (p.goal === 'lose' ? ' selected' : '') + '>إنقاص تدريجي</option></select></label>' +
      '<button class="btn" data-act="saveProfile">تحديث الخطة</button></div></div>' +
      '<div class="card" style="margin-top:12px"><h3>خطة اليوم · ' + plan.energy.target + ' سعراً</h3><div class="scroll"><table><thead><tr><th>الوجبة</th><th>المكوّنات</th><th>سعرات</th><th>كربوهيدرات</th></tr></thead><tbody>' +
      plan.meals.map(m => '<tr><td><b>' + m.label + '</b></td><td>' + m.items.map(i => esc(i.ar) + (i.qty !== 1 ? ' ×' + i.qty : '') + ' <span class="small mut">(' + esc(i.serving) + ')</span>').join('<br>') + '</td><td>' + m.kcal + '</td><td>' + m.carb + ' جم</td></tr>').join('') +
      '</tbody></table></div><p><b>المجموع:</b> ' + plan.totals.kcal + ' سعراً · كربوهيدرات ' + plan.totals.carb + ' جم · بروتين ' + plan.totals.protein + ' جم · ألياف ' + plan.totals.fiber + ' جم</p>' +
      '<p class="small mut">' + plan.notes.map(esc).join(' ') + '</p><div class="row"><button class="btn sec sm" data-act="shuffleDiet">بدّلي الخيارات</button></div></div>' +
      vKitchen(plan) +
      '<div class="card" style="margin-top:12px"><h3>سجّلي وجبة (تؤثر على نموذج الجلوكوز)</h3><div class="row"><label>الاسم<input id="ml-n" value="وجبة" style="width:140px"></label><label>كربوهيدرات (جم)<input id="ml-c" type="number" value="60" style="width:110px"></label><button class="btn" data-act="addMeal">تسجيل الآن</button></div></div>' +
      '<div class="card" style="margin-top:12px"><h3>مكمل أو عشب؟ اسألي قبل الاستخدام</h3><div class="row"><label>الاسم<input id="sp-q" placeholder="مثال: ميو إينوزيتول" style="width:220px"></label><label>أدويتي (اختياري)<input id="sp-m" value="' + esc(p.meds) + '" style="width:200px"></label><label><span>حامل؟</span><input id="sp-p" type="checkbox"' + (p.pregnant ? ' checked' : '') + '></label><label><span>ضغط مرتفع؟</span><input id="sp-h" type="checkbox"' + (p.hypertension ? ' checked' : '') + '></label><button class="btn" data-act="checkSupp">تحقق</button></div>' + fl('supp') + '<p class="small mut">محتوى تعليمي يحتاج مراجعة الطبيب/الصيدلي. إن لم أجد معلومة موثوقة لا أخمّن.</p></div>';
  }

  // ---------- وجبة من المكوّنات الموجودة ----------
  function pantry() { const S = env.S; if (!S.pantry) S.pantry = { have: [], slot: 'any', res: null, unknown: [] }; return S.pantry; }
  function vKitchen(plan) {
    const pt = pantry(), H = new Set(pt.have);
    const chips = KT.INGREDIENTS.map(i => '<button class="chip' + (H.has(i.id) ? ' on' : '') + '" data-act="pantryToggle" data-v="' + i.id + '" aria-pressed="' + H.has(i.id) + '">' + esc(i.ar) + '</button>').join(' ');
    const res = pt.res ? KT.suggest(pt.have, { slot: pt.slot, plan, limit: 3 }) : null;
    return '<div class="card" style="margin-top:12px" id="kitchen"><h3>وجبة من الموجود عندك</h3>' +
      '<p class="small mut">سجّلي المكوّنات المتوفرة في مطبخك، وأقترح لك وجبة تناسب خطتك اليومية (سعرات الوجبة، مؤشر جلايسيمي منخفض، ألياف وبروتين).</p>' +
      '<div class="row"><label>اكتبي المكوّنات<input id="pt-txt" placeholder="مثال: بيض، طماطم، بصل وسبانخ" style="width:260px"></label><button class="btn sec sm" data-act="pantryAdd">أضيفي</button>' +
      '<label>الوجبة<select id="pt-slot">' + [['any', 'أي وجبة'], ['b', 'الفطور'], ['l', 'الغداء أو العشاء'], ['s', 'وجبة خفيفة']].map(o => '<option value="' + o[0] + '"' + (pt.slot === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>' +
      '<button class="btn" data-act="suggestMeal">اقترحي وجبة</button>' + (pt.have.length ? '<button class="btn sec sm" data-act="pantryClear">مسح الكل</button>' : '') + '</div>' +
      (pt.unknown && pt.unknown.length ? '<p class="small" style="color:var(--warn)">لم أتعرف على: ' + pt.unknown.map(esc).join('، ') + '</p>' : '') +
      '<div style="margin-top:8px;line-height:2.2">' + chips + '</div>' +
      '<p class="small mut">المختار: ' + (pt.have.length ? pt.have.map(id => esc(KT.name(id))).join('، ') : 'لا شيء بعد') + '</p>' + fl('kit') +
      (res ? (res.length ? '<div class="grid g3" style="margin-top:8px">' + res.map(r =>
        '<div class="recipe"><h4>' + esc(r.ar) + '</h4><div class="small mut">' + esc(r.slotAr) + ' · ' + (r.servings !== 1 ? r.servings + ' حصة · ' : '') + 'مؤشر جلايسيمي ' + esc(r.gi) + '</div>' +
        '<p style="margin:6px 0"><b>' + r.kcal + '</b> سعراً · كربوهيدرات ' + r.carb + ' جم · بروتين ' + r.protein + ' جم · ألياف ' + r.fiber + ' جم</p>' +
        '<div class="small">من مطبخك: ' + r.used.map(esc).join('، ') + '</div>' + (r.missing.length ? '<div class="small miss">ينقصك: ' + r.missing.map(esc).join('، ') + '</div>' : '') +
        (r.extra.length ? '<div class="small mut">تحسّنها إضافة (اختياري): ' + r.extra.map(esc).join('، ') + '</div>' : '') +
        '<ul class="why small">' + r.why.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul><p class="small">' + esc(r.steps) + '</p>' +
        '<button class="btn sm" data-act="logRecipe" data-n="' + esc(r.ar) + '" data-c="' + r.carb + '">سجّليها كوجبة</button></div>').join('') + '</div>'
        : '<div class="alert warn" style="margin-top:8px">لا توجد وصفة مناسبة بالمكوّنات الحالية. أضيفي مصدر بروتين (بيض، دجاج، عدس، تونة) أو خضاراً.</div>') : '') +
      '<p class="small mut">القيم تقريبية، والوصفات عامة تحتاج مراجعة أخصائية تغذية، خاصة مع الحمل أو أمراض الكلى.</p></div>';
  }

  function vSymptoms() {
    const S = env.S, d = E.derive(env), b = d.bleeding, today = U.dayKey(S.clock.now);
    const te = S.symptoms.find(x => x.date === today) || {};
    const sl = (id, label) => '<label>' + label + ' (<output id="o-' + id + '">' + (te[id] != null ? te[id] : 0) + '</output>)<input type="range" id="s-' + id + '" min="0" max="3" step="1" value="' + (te[id] != null ? te[id] : 0) + '" data-out="o-' + id + '"></label>';
    const sevCls = s => s === 'danger' ? 'danger' : s === 'warn' ? 'warn' : s === 'ok' ? 'ok' : 'info';
    return '<h2>الأعراض والنزيف</h2>' + fl('sym') +
      '<div class="grid g2"><div class="card"><h3>يوميات الأعراض · ' + today + '</h3><div class="grid g3">' + sl('acne', 'حب الشباب') + sl('hirsutism', 'الشعر الزائد') + sl('fatigue', 'الإرهاق') + sl('mood', 'تقلب المزاج') + sl('cramps', 'ألم الحوض') + sl('bloating', 'الانتفاخ') + sl('hairloss', 'تساقط الشعر') + sl('headache', 'الصداع') + '</div><p class="small mut">0 = لا شيء، 3 = شديد.</p><button class="btn" data-act="saveSymptoms">حفظ اليوم</button></div>' +
      '<div class="card"><h3>تسجيل النزيف · ' + today + '</h3><div class="row">' +
      '<label>فوط خفيفة<input id="b-pl" type="number" min="0" value="0" style="width:70px"></label><label>متوسطة<input id="b-pm" type="number" min="0" value="0" style="width:70px"></label><label>مشبعة<input id="b-ps" type="number" min="0" value="0" style="width:70px"></label>' +
      '<label>خثرات صغيرة<input id="b-cs" type="number" min="0" value="0" style="width:70px"></label><label>خثرات كبيرة<input id="b-cl" type="number" min="0" value="0" style="width:70px"></label></div>' +
      '<div class="row"><label><span>تدفق مفاجئ</span><input id="b-fl" type="checkbox"></label><label><span>تبقيع فقط</span><input id="b-sp" type="checkbox"></label><label><span>دوخة</span><input id="b-dz" type="checkbox"></label><button class="btn" data-act="saveBleeding">حفظ</button></div></div></div>' +
      '<div class="card" style="margin-top:12px"><h3>تحليل نمط النزيف</h3>' + (b.patterns.length ? b.patterns.map(p => '<div class="alert ' + sevCls(p.sev) + '">' + esc(p.text) + '</div>').join('') : '<p class="mut">سجّلي دورتين على الأقل لاستخراج الأنماط.</p>') +
      (b.episodes.length ? '<div class="scroll"><table><thead><tr><th>البداية</th><th>النهاية</th><th>الأيام</th><th>PBAC</th><th>ملاحظات</th></tr></thead><tbody>' + b.episodes.map(e => '<tr><td>' + e.start + '</td><td>' + e.end + '</td><td>' + e.days + '</td><td>' + e.pbac + '</td><td>' + (e.spottingOnly ? 'تبقيع' : e.heavy ? 'غزير' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '') +
      '<p class="small mut">' + esc(b.note) + '</p></div>' +
      '<div class="card" style="margin-top:12px"><h3>الأعراض مقابل القراءات</h3><div class="scroll"><table><thead><tr><th>القراءة</th><th>العرض</th><th>النتيجة</th></tr></thead><tbody>' + d.corr.map(c => '<tr><td>' + esc(c.a) + '</td><td>' + esc(c.b) + '</td><td>' + esc(c.text) + '</td></tr>').join('') + '</tbody></table></div><p class="small mut">سبيرمان على قيم يومية؛ يلزم 10 أيام على الأقل. الارتباط ليس سببية.</p></div>';
  }

  function vTwin() {
    const S = env.S, d = E.derive(env), tw = S.twin, bs = d.twinBase;
    const cmp = TW.compare(bs, { deficitKcal: tw.deficit, activityMinPerWeek: tw.act, adherence: tw.adh / 100, fgAssumption: tw.fgAssumption });
    const r = cmp.scenario, b = cmp.baseline, H = tw.horizon;
    const P = (arr) => r.days.map((x, i) => [x, arr[i]]);
    const w = chart({ label: 'الوزن المتوقع', x0: 0, x1: H, y0: Math.floor(Math.min(...r.weight.lo, bs.weightKg) - 1), y1: Math.ceil(bs.weightKg + 1), xt: [0, 0.25, 0.5, 0.75, 1].map(f => ({ v: H * f, l: String(Math.round(H * f)) })),
      bands: [{ lo: P(r.weight.lo), hi: P(r.weight.hi) }], lines: [{ cls: 'l1', pts: P(r.weight.mid) }, { cls: 'l3', pts: P(b.weight.mid) }, { cls: 'l4', pts: P(TW.shamannaRef(bs.weightKg, r.days)) }] });
    const gl = chart({ label: 'سكر الصيام المتوقع', x0: 0, x1: H, y0: Math.floor(Math.min(...r.fg.lo) - 2), y1: Math.ceil(Math.max(...r.fg.hi, bs.fastingGlucose) + 2), xt: [0, 0.5, 1].map(f => ({ v: H * f, l: String(Math.round(H * f)) })),
      bands: [{ lo: P(r.fg.lo), hi: P(r.fg.hi) }], lines: [{ cls: 'l1', pts: P(r.fg.mid) }, { cls: 'l3', pts: P(b.fg.mid) }] });
    const sm = r.summary;
    const sc = TW.scenarios(bs);
    const sld = (id, label, min, max, step, v, unit) => '<label>' + label + ' (<output id="o-' + id + '">' + v + '</output> ' + unit + ')<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + v + '" data-out="o-' + id + '" data-twin="1"></label>';
    return '<h2>التوأم الرقمي · ماذا لو؟</h2>' + vBody(d) +
      '<div class="alert info" style="margin-top:12px">أداة تعليمية تعرض <b>نطاقاً محتملاً</b> لا وعداً. لا تتنبأ بالدورة الشهرية، ولا تقدّر الأعراض كمياً. بياناتك الحالية: وزن ' + bs.weightKg + ' كغ · سكر صائم ≈ ' + bs.fastingGlucose + ' ملغ/دل' + (bs.fastingInsulin != null ? ' · إنسولين صائم ' + bs.fastingInsulin : '') + '.</div>' +

  let holo = null;
  function startHolo() {
    if (holo) { cancelAnimationFrame(holo.raf); holo = null; }
    const cv = document.getElementById('holo'); if (!cv) return;
    const S = env.S, b = S.body; if (!b) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = 420 * dpr; cv.height = 560 * dpr;
    const st = { cv, angle: 0.5, drag: null, auto: true, raf: 0 };
    const build = () => { const pr = bodyProjection(); st.models = [{ rings: BD.rings(pr.at, b.shape), color: '#2dd4c8', glow: 10, width: 1.3 * dpr }, { rings: BD.rings(pr.now, b.shape), color: '#ff9ccb', alpha: b.n ? 0.35 : 0, glow: 0, width: 1 * dpr }]; };
    build(); st.build = build;
    const frame = () => { if (!document.body.contains(cv)) { holo = null; return; } if (st.auto && !st.drag) st.angle += 0.006; BD.draw(cv, st.models, st.angle); st.raf = requestAnimationFrame(frame); };
    cv.addEventListener('pointerdown', e => { st.drag = { x: e.clientX, a: st.angle }; st.auto = false; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (st.drag) st.angle = st.drag.a + (e.clientX - st.drag.x) * 0.012; });
    cv.addEventListener('pointerup', () => { st.drag = null; });
    holo = st; frame();
  }

  async function scanBody(file) {
    const S = env.S, b = S.body;
    if (!file || !/^image\//.test(file.type)) { setFlash('scan', 'اختاري صورة.', 'warn'); render(); return; }
    let bmp = null, url = null;
    try {
      // نحمّل الصورة في الذاكرة فقط ونصغّرها، ثم نتخلص منها فوراً
      if (window.createImageBitmap) bmp = await createImageBitmap(file);
      else { url = URL.createObjectURL(file); bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = url; }); }
      const h = 220, w = Math.max(60, Math.round(h * bmp.width / bmp.height));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(bmp, 0, 0, w, h); const data = cx.getImageData(0, 0, w, h).data;
      cx.clearRect(0, 0, w, h); c.width = c.height = 0;
      const sil = BD.silhouette(data, w, h); data.fill(0);
      const xr = document.getElementById('xray'); if (xr) { BD.drawXray(xr, sil, w, h); xr.hidden = false; }
      if (sil.ok && sil.shape) { b.shape = sil.shape; b.scanAt = S.clock.now; save(); setFlash('scan', 'تم المسح: طُبّقت نسب جسمك على المجسّم، ولم تُحفظ الصورة.', 'ok'); }
      else setFlash('scan', 'تعذّر عزل الجسم بوضوح. جرّبي خلفية بلون واحد وأن يظهر الجسم كاملاً. لم تُحفظ الصورة.', 'warn');
    } catch (e) { setFlash('scan', 'تعذّرت قراءة الصورة على هذا المتصفح.', 'warn'); }
    finally { if (bmp && bmp.close) bmp.close(); if (url) URL.revokeObjectURL(url); const fi = document.getElementById('bd-scan'); if (fi) fi.value = ''; }
    const keep = document.getElementById('xray'); const snap = keep && !keep.hidden ? keep : null;
    render();
    if (snap) { const nx = document.getElementById('xray'); if (nx) { nx.replaceWith(snap); } }
  }
